<style>
:root{--bg:#f4f5fa;--card:#fff;--ink:#1b2233;--mut:#6b7385;--line:#dfe3ec;--exp:#d9435b;--inc:#0f9d7a;--acc:#4338ca;--on:#fff;--sh:rgba(27,34,51,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#11131a;--card:#1a1d27;--ink:#e8eaf2;--mut:#98a0b3;--line:#2c3040;--exp:#ff7b8f;--inc:#4fd1aa;--acc:#8b8cf8;--on:#11131a;--sh:rgba(0,0,0,.5);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,[onclick],[role=button],.tabs *,nav *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button:focus,a:focus,[tabindex]:focus{outline:none}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 'Anek Bangla',system-ui,sans-serif;padding-bottom:150px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
[hidden]{display:none!important}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;box-shadow:0 4px 10px var(--sh)}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;max-width:720px;margin:auto}
.logo{font:italic 800 31px 'Fraunces',Georgia,serif;margin:0;letter-spacing:-1px;color:var(--acc)}
.lb{border:2px solid var(--acc);background:none;color:var(--ink);border-radius:20px;padding:4px 14px;font:inherit;font-weight:700}
#us{padding:2px;width:36px;height:34px;display:grid;place-items:center;border-radius:50%}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;display:block}

const LEG={pp:{en:`<p><small>Last updated: 24 October 2026</small></p><h4>1. What this app is</h4><p>Budget is a personal income and expense tracker, made by Md. Rakib Hossain. The code of this app was written entirely with Claude AI, an AI assistant made by Anthropic.</p><h4>2. What data we handle</h4><p>(a) What you enter: amounts, categories, notes, wallets, budgets, dates and settings (language, theme, currency). (b) If you sign in with Google: your name, email address, profile photo and a unique account ID from Google. We never see your Google password. (c) If you use the optional AI chat: the Gemini API key you paste in and the messages you type there.</p><h4>3. Where it is stored</h4><p>Without login, only in your device’s browser storage. We cannot see it, and clearing browser data deletes it. With login, it is also stored in Google Firebase (Cloud Firestore) under your account so it syncs across devices. Security rules allow only your signed-in account to read or write your data. A custom name or profile photo you set in the app is saved the same way. A passcode and the answers to your security questions, if you set them, are stored only on your device (as one-way hashes) and are never uploaded. Your Gemini API key, if you add one, is also stored only in this browser on your device. It is never uploaded to our cloud or synced to other devices, and it is kept as plain text in browser storage, so use it only on devices you trust. By default it is kept only for the current browser session and disappears when you close the app or sign out; if you tick “Remember on this device” it stays until you remove it. Wallet details, search and the period filter (daily to yearly) run on your device using the data you already have.</p><h4>4. How we use it</h4><p>Only to run the app: show your records, search them on your device, sync, and create reports, PDF and CSV. No ads, no selling or sharing of your data, and no tracking or analytics run by us.</p><p>AI chat (optional): it works only if you add your own Gemini API key. When you send a message there, or tap a ready-made prompt, the app sends your message, the conversation so far and a summary of your data for the period you choose in the AI chat (Daily, Weekly, Monthly, 3 months, 6 months or Yearly): totals, category amounts, a comparison with the previous period, monthly totals of the last 6 months, budgets, wallet names and balances, and up to your 500 most recent records in that period including their notes) directly from your device to Google’s Gemini API using your key. We do not receive or store these messages, and nothing is sent until you send a message. The chat history is kept only in memory and disappears when you reload the app, tap the clear button or close the page.</p><h4>5. Third parties</h4><p>Google (sign-in and database via Firebase), Google Gemini API (only if you use the AI chat; Google’s own terms and privacy policy apply to what you send), Google Fonts (fonts), Cloudflare cdnjs (PDF libraries) and the hosting service may log standard visit information such as IP address. Their own policies apply. Tally (tally.so) is used only if you tap Feedback in Settings: the form opens in your browser, what you type there goes to Tally and the app owner under Tally’s own terms and privacy policy, and the app does not send your budget data to it. Tawk.to (tawk.to) is loaded only if you tap Live support in Settings: the chat opens in the app, what you type there, any name or email you choose to give, and technical details such as your IP address, browser and device go to Tawk.to and the app owner under Tawk.to’s own terms and privacy policy (it may also set its own cookies or local storage), and the app does not send your budget data to it. Please do not share passwords, card numbers or other sensitive details in the chat. The eBook (Settings → eBook) opens on FlipHTML5 in your browser only when you tap it; FlipHTML5’s own terms and privacy policy apply there, and the app sends it nothing. The Help page is built into the app and collects nothing.</p><p><b>Google (sign-in, Gemini API, Fonts)</b> — <a href="https://policies.google.com/terms" target="_blank" rel="noopener noreferrer">Terms</a> · <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">Privacy</a><br><b>Firebase (login and database)</b> — <a href="https://firebase.google.com/terms" target="_blank" rel="noopener noreferrer">Terms</a> · <a href="https://firebase.google.com/support/privacy" target="_blank" rel="noopener noreferrer">Privacy</a><br><b>Gemini API (AI chat)</b> — <a href="https://ai.google.dev/gemini-api/terms" target="_blank" rel="noopener noreferrer">Terms</a><br><b>Google Fonts</b> — <a href="https://developers.google.com/fonts/faq/privacy" target="_blank" rel="noopener noreferrer">Privacy</a><br><b>Cloudflare (cdnjs and the News proxy on Workers)</b> — <a href="https://www.cloudflare.com/website-terms/" target="_blank" rel="noopener noreferrer">Terms</a> · <a href="https://www.cloudflare.com/privacypolicy/" target="_blank" rel="noopener noreferrer">Privacy</a><br><b>Tally (Feedback form)</b> — <a href="https://tally.so/help/terms-conditions" target="_blank" rel="noopener noreferrer">Terms</a> · <a href="https://tally.so/help/privacy-policy" target="_blank" rel="noopener noreferrer">Privacy</a><br><b>Tawk.to (Live support)</b> — <a href="https://www.tawk.to/terms-of-service/" target="_blank" rel="noopener noreferrer">Terms</a> · <a href="https://www.tawk.to/privacy-policy/" target="_blank" rel="noopener noreferrer">Privacy</a><br><b>FlipHTML5 (eBook)</b> — <a href="https://fliphtml5.com/terms-of-service.php" target="_blank" rel="noopener noreferrer">Terms</a> · <a href="https://fliphtml5.com/privacy-policy.php" target="_blank" rel="noopener noreferrer">Privacy</a><br><b>The Guardian Open Platform (News)</b> — <a href="https://open-platform.theguardian.com/terms/" target="_blank" rel="noopener noreferrer">Terms</a> · <a href="https://www.theguardian.com/help/terms-of-service" target="_blank" rel="noopener noreferrer">Website terms</a> · <a href="https://www.theguardian.com/info/privacy" target="_blank" rel="noopener noreferrer">Privacy</a><br><b>html2canvas</b> <a href="https://github.com/niklasvh/html2canvas/blob/master/LICENSE" target="_blank" rel="noopener noreferrer">MIT licence</a> · <b>jsPDF</b> <a href="https://github.com/parallax/jsPDF/blob/master/LICENSE" target="_blank" rel="noopener noreferrer">MIT licence</a> (PDF libraries)</p><h4>6. Reports and files</h4><p>PDF, CSV and print files are created on your device and are not uploaded anywhere.</p><h4>7. Loan tracker (optional)</h4><p>The Loan tracker is off by default and works only if you turn it on in Settings. If you use it, whatever you enter there is stored and synced exactly like your other records: names of people you borrowed from or lent to, amounts, dates, interest rates, notes and repayments. Without login this stays in your device’s browser storage; with login it is also stored in your account in Google Firebase. The names you type belong to other people, so please enter only what you need and avoid sensitive details. The app does not contact those people, does not read your phone contacts and sends them nothing. The Remind and Statement buttons only prepare a text; if you share it, you do so yourself through the app you choose, or you copy it. When you pick a wallet, matching entries (such as “Loan taken” or “Loan repaid”) are added to your Entries and appear in your Entries and in exported lists (PDF and CSV), and are counted in totals only if you turn on that option in Settings. Turning the tracker off only hides it and keeps your loan data; delete the loans, or clear your data, to remove it. We do not use loan data for advertising, credit scoring or any purpose other than running the app.</p><h4>8. Recycle bin and display options</h4><p>When you delete a record (or a loan), it is not erased at once. It goes to the Recycle bin in Settings, where you can restore it, delete it forever, or empty the bin. Items in the bin are stored together with your other data, in the same places (your device’s browser storage and, if you are signed in, your account in Google Firebase), and are erased permanently 30 days after deletion. When you clear your data or delete your account, everything is erased permanently, the Recycle bin is emptied too, and nothing from that is placed in the Recycle bin. In Settings you can also hide the AI chat button; this only hides the button and does not remove your saved Gemini API key (use “Remove key” for that).</p><h4>9. News (optional)</h4><p>The News feature loads only when you open it from Settings. Your device then asks a news proxy run by the app owner on Cloudflare Workers, which adds the owner’s API key and fetches headlines from The Guardian Open Platform. The app sends only the section, search word and page number you choose, and never your budget data. Cloudflare and The Guardian may log standard request information such as your IP address, and article pictures are loaded from The Guardian’s image servers. Tapping a story opens theguardian.com, where The Guardian’s own terms, privacy policy and cookies apply.</p><h4>10. Notifications (optional)</h4><p>Notifications are in-app alerts shown under the 🔔 button. They are worked out on your device from your own entries, budgets, wallets and loans (for example a budget at 80%, a category with unusually high spending, no expense added today, or a loan due date). They are not sent to us or anyone else, and no push messages are sent when the app is closed. Your on/off choices and dismissed alerts are saved with your other settings (and in your account if you are signed in). You can turn them off in Settings.</p><h4>11. Your choices and deleting your account</h4><p>You can use the app without logging in, sign out at any time and delete records inside the app. You can remove your Gemini API key at any time with the key button in the AI chat. When you sign out, the app asks whether to remove a key you saved on this device; if you choose to keep it, it stays, while Clear data on this device, resetting a forgotten passcode by erasing data, and deleting your account always remove it. In Settings, Clear data lets you erase the copy saved on this device or, when logged in, erase all your records, wallets, categories and budgets in the cloud while keeping your account. If you forget your passcode, you can reset it with your security questions; without them, a logged-in user can confirm the account email, and otherwise the data on this device must be cleared (without login, this erases the data). You can delete your account yourself: tap your profile picture, then Delete account. After a warning and one more Google sign-in to confirm, this permanently deletes:</p><ul><li>your cloud data (records, wallets, categories, budgets, settings),</li><li>the copy of that data on the device, and</li><li>your sign-in with this app.</li></ul><p>Your Google account itself is not deleted. Deletion cannot be undone, and Google’s systems may take a short time to fully remove deleted data. You can also email <a href="mailto:${CONTACT}">${CONTACT}</a> for help.</p><h4>12. Security</h4><p>Data travels over HTTPS and is protected by account-based rules, but no system is 100% secure. Keep your Google account safe and sign out on shared devices.</p><h4>13. Children</h4><p>This app is not meant for children under 13.</p><h4>14. Changes</h4><p>If this policy changes, the new version and date will appear here.</p><h4>15. Contact</h4><p><a href="mailto:${CONTACT}">${CONTACT}</a></p>`,
bn:`<p><small>শেষ হালনাগাদ: ২৪ অক্টোবর ২০২৬</small></p><h4>১. এই অ্যাপ কী</h4><p>Budget হলো ব্যক্তিগত আয়-ব্যয়ের হিসাব রাখার অ্যাপ, তৈরি করেছেন Md. Rakib Hossain। এই অ্যাপের কোড সম্পূর্ণ Claude AI (Anthropic এর তৈরি একটি AI সহকারী) দিয়ে লেখা।</p><h4>২. আমরা কোন তথ্য নিই</h4><p>(ক) আপনার দেওয়া হিসাব: টাকার অঙ্ক, ক্যাটাগরি, নোট, ওয়ালেট, বাজেট, তারিখ এবং সেটিংস (ভাষা, থিম, কারেন্সি)। (খ) Google দিয়ে লগইন করলে: আপনার নাম, ইমেইল, প্রোফাইল ছবি ও Google এর দেওয়া একটি ইউনিক আইডি। আপনার Google পাসওয়ার্ড আমরা কখনো দেখি না। (গ) ঐচ্ছিক AI চ্যাট ব্যবহার করলে: আপনার পেস্ট করা Gemini API Key এবং সেখানে লেখা মেসেজ।</p><h4>৩. তথ্য কোথায় থাকে</h4><p>লগইন ছাড়া শুধু আপনার ডিভাইসের ব্রাউজারে থাকে। আমরা তা দেখতে পাই না, আর ব্রাউজারের ডেটা মুছলে তা চলে যাবে। লগইন করলে Google Firebase (Cloud Firestore) এ আপনার অ্যাকাউন্টের অধীনে সেভ হয়, যাতে সব ডিভাইসে সিঙ্ক থাকে। নিরাপত্তা নিয়মে শুধু আপনার লগইন করা অ্যাকাউন্টই আপনার তথ্য পড়তে ও লিখতে পারে। অ্যাপে আপনার দেওয়া নাম বা প্রোফাইল ছবিও একইভাবে সেভ হয়। পাসকোড এবং নিরাপত্তা প্রশ্নের উত্তর দিলে তা শুধু আপনার ডিভাইসে (একমুখী হ্যাশ হিসেবে) থাকে, কখনো আপলোড হয় না। আপনি Gemini API Key দিলে সেটিও শুধু এই ডিভাইসের ব্রাউজারে থাকে। এটি আমাদের ক্লাউডে আপলোড বা অন্য ডিভাইসে সিঙ্ক হয় না, আর ব্রাউজার স্টোরেজে সাধারণ টেক্সট হিসেবে থাকে, তাই শুধু বিশ্বস্ত ডিভাইসে ব্যবহার করুন। ডিফল্টভাবে এটি শুধু বর্তমান ব্রাউজার সেশনে থাকে এবং অ্যাপ বন্ধ করলে বা লগআউট করলে চলে যায়; “এই ডিভাইসে মনে রাখো” টিক দিলে আপনি না মোছা পর্যন্ত থাকে। ওয়ালেটের বিবরণ, খোঁজা এবং সময়কাল ফিল্টার (দৈনিক থেকে বাৎসরিক) আপনার ডিভাইসেই, আপনার আগের ডেটা দিয়ে চলে।</p><h4>৪. কীভাবে ব্যবহার হয়</h4><p>শুধু অ্যাপ চালাতে: রেকর্ড দেখানো, আপনার ডিভাইসে খোঁজা, সিঙ্ক করা, রিপোর্ট/PDF/CSV বানানো। আমরা বিজ্ঞাপন দেখাই না, আপনার তথ্য বিক্রি বা শেয়ার করি না, আর নিজেরা কোনো ট্র্যাকিং বা অ্যানালিটিক্স চালাই না।</p><p>AI চ্যাট (ঐচ্ছিক): নিজের Gemini API Key দিলে তবেই চলে। সেখানে মেসেজ পাঠালে বা তৈরি প্রম্পটে চাপলে অ্যাপ আপনার মেসেজ, আগের কথোপকথন এবং AI চ্যাটে আপনার বেছে নেওয়া সময়ের (দৈনিক, সাপ্তাহিক, মাসিক, ৩ মাস, ৬ মাস বা বার্ষিক) ডেটার সারাংশ (মোট অঙ্ক, ক্যাটাগরি অনুযায়ী অঙ্ক, আগের সময়ের সাথে তুলনা, গত ৬ মাসের মাসওয়ারি মোট, বাজেট, ওয়ালেটের নাম ও ব্যালেন্স এবং ওই সময়ের নোটসহ সাম্প্রতিক সর্বোচ্চ ৫০০টি রেকর্ড) আপনার ডিভাইস থেকে আপনার কি দিয়ে সরাসরি Google এর Gemini API তে পাঠায়। এই মেসেজ আমরা পাই না বা সংরক্ষণ করি না, আর আপনি মেসেজ না পাঠালে কিছুই পাঠানো হয় না। চ্যাটের ইতিহাস শুধু মেমরিতে থাকে; অ্যাপ রিলোড করলে, মুছুন বাটন চাপলে বা পেজ বন্ধ করলে চলে যায়।</p><h4>৫. তৃতীয় পক্ষ</h4><p>Google (Firebase এর মাধ্যমে লগইন ও ডেটাবেস), Google Gemini API (শুধু AI চ্যাট ব্যবহার করলে; আপনার পাঠানো তথ্যে Google এর নিজস্ব শর্ত ও গোপনীয়তা নীতি প্রযোজ্য), Google Fonts (ফন্ট), Cloudflare cdnjs (PDF লাইব্রেরি) এবং হোস্টিং সেবা সাধারণ ভিজিটের তথ্য (যেমন IP অ্যাড্রেস) লগ করতে পারে। তাদের নিজ নিজ নীতি প্রযোজ্য। সেটিংসে “মতামত” চাপলে তবেই Tally (tally.so) ব্যবহার হয়: ফর্মটি আপনার ব্রাউজারে খোলে, সেখানে আপনি যা লেখেন তা Tally এর নিজস্ব শর্ত ও গোপনীয়তা নীতি অনুযায়ী Tally ও অ্যাপের মালিকের কাছে যায়, আর অ্যাপ আপনার বাজেটের ডেটা সেখানে পাঠায় না। সেটিংসে “লাইভ সাপোর্ট” চাপলে তবেই Tawk.to (tawk.to) লোড হয়: চ্যাট অ্যাপের ভেতরেই খোলে, সেখানে আপনি যা লেখেন, নিজে থেকে নাম বা ইমেইল দিলে তা, এবং IP অ্যাড্রেস, ব্রাউজার ও ডিভাইসের মতো প্রযুক্তিগত তথ্য Tawk.to এর নিজস্ব শর্ত ও গোপনীয়তা নীতি অনুযায়ী Tawk.to ও অ্যাপের মালিকের কাছে যায় (তারা নিজস্ব কুকি বা লোকাল স্টোরেজও রাখতে পারে), আর অ্যাপ আপনার বাজেটের ডেটা সেখানে পাঠায় না। চ্যাটে পাসওয়ার্ড, কার্ড নম্বর বা অন্য স্পর্শকাতর তথ্য দেবেন না। সেটিংসের ই-বুক চাপলে তবেই FlipHTML5 এ আপনার ব্রাউজারে ই-বুক খোলে; সেখানে FlipHTML5 এর নিজস্ব শর্ত ও গোপনীয়তা নীতি প্রযোজ্য, আর অ্যাপ সেখানে কিছু পাঠায় না। সাহায্য পাতাটি অ্যাপের ভেতরেই থাকে এবং কিছু সংগ্রহ করে না।</p><p><b>Google (sign-in, Gemini API, Fonts)</b> — <a href="https://policies.google.com/terms" target="_blank" rel="noopener noreferrer">শর্তাবলি</a> · <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">গোপনীয়তা নীতি</a><br><b>Firebase (log tml2canvas/blob/master/LICENSE" target="_blank" rel="noopener noreferrer">MIT লাইসেন্স</a> · <b>jsPDF</b> <a href="https://github.com/parallax/jsPDF/blob/master/LICENSE" target="_blank" rel="noopener noreferrer">MIT লাইসেন্স</a> (PDF লাইব্রেরি)</p><h4>৬. রিপোর্ট ও ফাইল</h4><p>PDF, CSV ও প্রিন্ট আপনার ডিভাইসেই তৈরি হয়, কোথাও আপলোড হয় না।</p><h4>৭. লোন ট্র্যাকার (ঐচ্ছিক)</h4><p>লোন ট্র্যাকার শুরুতে বন্ধ থাকে এবং সেটিংসে চালু করলেই কাজ করে। ব্যবহার করলে সেখানে যা লিখবেন, অর্থাৎ যাদের কাছ থেকে ধার নিয়েছেন বা যাদের ধার দিয়েছেন তাদের নাম, টাকার অঙ্ক, তারিখ, সুদের হার, নোট ও পরিশোধ, তা অন্য রেকর্ডের মতোই সংরক্ষিত ও সিঙ্ক হয়। লগইন ছাড়া এগুলো শুধু আপনার ডিভাইসের ব্রাউজারে থাকে; লগইন করলে Google Firebase এ আপনার অ্যাকাউন্টেও থাকে। আপনি যাদের নাম লেখেন তারা অন্য মানুষ, তাই শুধু প্রয়োজনীয় তথ্য লিখুন এবং স্পর্শকাতর তথ্য এড়িয়ে চলুন। অ্যাপ ওই ব্যক্তিদের সাথে যোগাযোগ করে না, আপনার ফোনের কন্টাক্ট পড়ে না এবং তাদের কিছু পাঠায় না। “তাগাদা” ও “স্টেটমেন্ট” বাটন শুধু মেসেজ তৈরি করে; শেয়ার করলে সেটা আপনি নিজেই আপনার বাছা অ্যাপ দিয়ে করেন, অথবা কপি করে নেন। ওয়ালেট বাছলে মিলিয়ে এন্ট্রি (যেমন “লোন নেওয়া” বা “লোন পরিশোধ”) আপনার লেনদেনে যোগ হয় এবং লেনদেনে ও এক্সপোর্ট করা তালিকায় (PDF ও CSV) দেখা যায়, আর সেটিংসে সেই অপশন চালু করলে তবেই মোট অঙ্কে ধরা হয়। ট্র্যাকার বন্ধ করলে শুধু লুকানো থাকে, লোনের ডেটা থেকে যায়; মুছতে চাইলে লোনগুলো মুছুন বা ডেটা পরিষ্কার করুন। লোনের তথ্য আমরা বিজ্ঞাপন, ক্রেডিট স্কোর বা অ্যাপ চালানো ছাড়া অন্য কাজে ব্যবহার করি না।</p><h4>৮. রিসাইকেল বিন ও প্রদর্শনের অপশন</h4><p>কোনো রেকর্ড (বা লোন) মুছলে সেটি সাথে সাথে মুছে যায় না। সেটি সেটিংসের রিসাইকেল বিনে যায়, যেখান থেকে ফিরিয়ে আনা, চিরতরে মোছা বা বিন খালি করা যায়। বিনের জিনিস আপনার অন্য ডেটার সাথে একই জায়গায় থাকে (আপনার ডিভাইসের ব্রাউজারে এবং লগইন করা থাকলে Google Firebase এ আপনার অ্যাকাউন্টে) এবং মোছার ৩০ দিন পর স্থায়ীভাবে মুছে যায়। আপনি ডেটা মুছলে বা অ্যাকাউন্ট মুছলে সবকিছু স্থায়ীভাবে মুছে যায়, রিসাইকেল বিনও খালি হয়ে যায় এবং তা থেকে কিছু রিসাইকেল বিনে জমা হয় না। সেটিংসে AI চ্যাট বাটনও লুকিয়ে রাখা যায়; এতে শুধু বাটন লুকায়, আপনার সেভ করা Gemini API Key মুছে যায় না (সেজন্য “কি মুছুন” ব্যবহার করুন)।</p><h4>৯. খবর (ঐচ্ছিক)</h4><p>খবর ফিচার সেটিংস থেকে খুললে তবেই লোড হয়। তখন আপনার ডিভাইস অ্যাপের মালিকের চালানো Cloudflare Workers এর একটি নিউজ প্রক্সিকে অনুরোধ পাঠায়, যেটি মালিকের API Key যোগ করে The Guardian Open Platform থেকে শিরোনাম আনে। অ্যাপ শুধু আপনার বাছা সেকশন, খোঁজার শব্দ ও পৃষ্ঠার নম্বর পাঠায়, বাজেটের ডেটা কখনো নয়। Cloudflare ও The Guardian সাধারণ অনুরোধের তথ্য (যেমন আপনার IP অ্যাড্রেস) লগ করতে পারে, আর খবরের ছবি The Guardian এর ইমেজ সার্ভার থেকে আসে। কোনো খবরে চাপলে theguardian.com খোলে, যেখানে The Guardian এর নিজস্ব শর্ত, গোপনীয়তা নীতি ও কুকি প্রযোজ্য।</p><h4>১০. নোটিফিকেশন (ঐচ্ছিক)</h4><p>নোটিফিকেশন হলো 🔔 বাটনে দেখানো অ্যাপের ভেতরের সতর্কতা। এগুলো আপনার ডিভাইসেই আপনার এন্ট্রি, বাজেট, ওয়ালেট ও লোন থেকে হিসাব হয় (যেমন বাজেটের ৮০%, কোনো ক্যাটাগরিতে অস্বাভাবিক বেশি খরচ, আজ খরচ যোগ না করা, বা লোনের মেয়াদ)। এগুলো আমাদের বা অন্য কারও কাছে পাঠানো হয় না, এবং অ্যাপ বন্ধ থাকলে কোনো পুশ মেসেজ যায় না। আপনার চালু/বন্ধ পছন্দ ও সরিয়ে দেওয়া সতর্কতা অন্য সেটিংসের সাথে সংরক্ষিত হয় (সাইন-ইন থাকলে আপনার অ্যাকাউন্টেও)। সেটিংসে এগুলো বন্ধ করা যায়।</p><h4>১১. আপনার নিয়ন্ত্রণ ও অ্যাকাউন্ট মোছা</h4><p>লগইন ছাড়াই অ্যাপ ব্যবহার করা যায়। যেকোনো সময় সাইন আউট করা যায় এবং অ্যাপ থেকে রেকর্ড মুছে ফেলা যায়। AI চ্যাটের চাবি (🔑) বাটন দিয়ে যেকোনো সময় Gemini API Key মুছতে পারেন। লগআউটের সময় অ্যাপ জিজ্ঞাসা করে এই ডিভাইসে সেভ করা key মুছবেন কিনা; রাখতে চাইলে তা থেকে যায়; তবে এই ডিভাইসের ডেটা মুছলে, ডেটা মুছে পাসকোড রিসেট করলে এবং অ্যাকাউন্ট মুছলে তা সবসময় মুছে যায়। সেটিংসের “ডেটা মুছুন” থেকে এই ডিভাইসে সেভ থাকা কপি, অথবা লগইন করা থাকলে ক্লাউডের সব রেকর্ড, ওয়ালেট, ক্যাটাগরি ও বাজেট (অ্যাকাউন্ট রেখে) মুছে ফেলা যায়। পাসকোড ভুলে গেলে নিরাপত্তা প্রশ্ন দিয়ে রিসেট করা যায়; প্রশ্ন না থাকলে লগইন করা ব্যবহারকারী অ্যাকাউন্টের ইমেইল লিখে নিশ্চিত করতে পারেন, নয়তো এই ডিভাইসের ডেটা মুছতে হবে (লগইন ছাড়া হলে ডেটা মুছে যায়)। আপনি নিজেই অ্যাকাউন্ট মুছতে পারেন: প্রোফাইল ছবিতে চাপ দিয়ে “অ্যাকাউন্ট মুছুন” বেছে নিন। সতর্কবার্তা দেখে এবং নিশ্চিত করতে আবার Google দিয়ে সাইন ইন করলে নিচের জিনিসগুলো স্থায়ীভাবে মুছে যায়:</p><ul><li>ক্লাউডে থাকা আপনার তথ্য (রেকর্ড, ওয়ালেট, ক্যাটাগরি, বাজেট, সেটিংস),</li><li>ওই ডিভাইসে থাকা তথ্যের কপি, এবং</li><li>এই অ্যাপে আপনার লগইন।</li></ul><p>আপনার Google অ্যাকাউন্ট নিজে মুছে যায় না। মোছা কাজ আর ফেরানো যায় না, আর Google এর সিস্টেম থেকে মুছে যাওয়া তথ্য পুরোপুরি সরতে কিছু সময় লাগতে পারে। সাহায্যের জন্য <a href="mailto:${CONTACT}">${CONTACT}</a> এ ইমেইলও করতে পারেন।</p><h4>১২. নিরাপত্তা</h4><p>তথ্য HTTPS দিয়ে যায় এবং অ্যাকাউন্টভিত্তিক নিয়মে সুরক্ষিত। তবে কোনো সিস্টেমই ১০০% নিরাপদ নয়। আপনার Google অ্যাকাউন্ট নিরাপদ রাখুন, আর শেয়ার করা ডিভাইসে ব্যবহার শেষে সাইন আউট করুন।</p><h4>১৩. শিশু</h4><p>এই অ্যাপ ১৩ বছরের কম বয়সীদের জন্য নয়।</p><h4>১৪. পরিবর্তন</h4><p>নীতি বদলালে নতুন সংস্করণ ও তারিখ এখানে দেখানো হবে।</p><h4>১৫. যোগাযোগ</h4><p><a href="mailto:${CONTACT}">${CONTACT}</a></p>`},
tc:{en:`<p><small>Last updated: 24 October 2026</small></p><h4>1. Acceptance</h4><p>By using Budget you agree to these terms. If you do not agree, please do not use the app.</p><h4>2. The service</h4><p>Budget is a free personal money tracker made by Md. Rakib Hossain, provided “as is”. The code of this app was written entirely with Claude AI, so it may contain mistakes or bugs. You can report them with Feedback in Settings.</p><h4>3. Not professional advice</h4><p>Budget is not financial, tax, accounting or legal advice. Totals and reports depend on what you enter, so please check them yourself. The Help page gives general guidance and may not cover every case.</p><h4>4. Your data and account</h4><p>Your data belongs to you. You are responsible for entering it correctly, keeping your device and Google account secure, and keeping your own backup (for example a PDF or CSV export). You can clear your data from Settings or delete your account from the profile menu at any time. Clearing and deletion are permanent and cannot be undone.</p><h4>5. Acceptable use</h4><p>Do not misuse the app: no unauthorised access, no disrupting the service, no bypassing its security, and no unlawful use.</p><h4>6. AI chat (optional)</h4><p>The AI chat is optional and works only with your own Gemini API key, which you get from Google AI Studio. You are responsible for your key, for keeping it private, and for any usage limits or charges under your Google account. When you use the chat, your message and a summary of your budget data are sent to Google’s Gemini API, and Google’s own terms apply to that. Do not type passwords, card numbers or other sensitive details. AI answers can be wrong, incomplete or out of date. They are general information based on what you recorded, not financial, tax, accounting or legal advice, so please check them before acting. The chat needs an internet connection and may stop working if Google changes or limits its service.</p><h4>7. Third-party services</h4><p>Budget relies on other services to work. Using the app also means using them, and their own terms and privacy policies apply to what they handle. You can read them here:</p><p><b>Google (sign-in, Gemini API, Fonts)</b> — <a href="https://policies.google.com/terms" target="_blank" rel="noopener noreferrer">Terms</a> · <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">Privacy</a><br><b>Firebase (login and database)</b> — <a href="https://firebase.google.com/terms" target="_blank" rel="noopener noreferrer">Terms</a> · <a href="https://firebase.google.com/support/privacy" target="_blank" rel="noopener noreferrer">Privacy</a><br><b>Gemini API (AI chat)</b> — <a href="https://ai.google.dev/gemini-api/terms" target="_blank" rel="noopener noreferrer">Terms</a><br><b>Google Fonts</b> — <a href="https://developers.google.com/fonts/faq/privacy" target="_blank" rel="noopener noreferrer">Privacy</a><br><b>Cloudflare (cdnjs and the News proxy on Workers)</b> — <a href="https://www.cloudflare.com/website-terms/" target="_blank" rel="noopener noreferrer">Terms</a> · <a href="https://www.cloudflare.com/privacypolicy/" target="_blank" rel="noopener noreferrer">Privacy</a><br><b>Tally (Feedback form)</b> — <a href="https://tally.so/help/terms-conditions" target="_blank" rel="noopener noreferrer">Terms</a> · <a href="https://tally.so/help/privacy-policy" target="_blank" rel="noopener noreferrer">Privacy</a><br><b>Tawk.to (Live support)</b> — <a href="https://www.tawk.to/terms-of-service/" target="_blank" rel="noopener noreferrer">Terms</a> · <a href="https://www.tawk.to/privacy-policy/" target="_blank" rel="noopener noreferrer">Privacy</a><br><b>FlipHTML5 (eBook)</b> — <a href="https://fliphtml5.com/terms-of-service.php" target="_blank" rel="noopener noreferrer">Terms</a> · <a href="https://fliphtml5.com/privacy-policy.php" target="_blank" rel="noopener noreferrer">Privacy</a><br><b>The Guardian Open Platform (News)</b> — <a href="https://open-platform.theguardian.com/terms/" target="_blank" rel="noopener noreferrer">Terms</a> · <a href="https://www.theguardian.com/help/terms-of-service" target="_blank" rel="noopener noreferrer">Website terms</a> · <a href="https://www.theguardian.com/info/privacy" target="_blank" rel="noopener noreferrer">Privacy</a><br><b>html2canvas</b> <a href="https://github.com/niklasvh/html2canvas/blob/master/LICENSE" target="_blank" rel="noopener noreferrer">MIT licence</a> · <b>jsPDF</b> <a href="https://github.com/parallax/jsPDF/blob/master/LICENSE" target="_blank" rel="noopener noreferrer">MIT licence</a> (PDF libraries)</p><p>The eBook opens on FlipHTML5, a third-party site, only when you tap it. Live support (Tawk.to) is optional and loads only when you open it; anything you type in the chat goes to Tawk.to and the app owner, so never share passwords or card numbers there. We do not control these services and are not responsible for them. Their terms and links may change; please check the official pages.</p><h4>8. Currency</h4><p>The currency setting only changes the symbol. Existing amounts are not converted.</p><h4>9. Loan tracker</h4><p>The Loan tracker is an optional note-keeping aid for your own personal records. It is not a lending service: the app does not lend, collect, send, hold or transfer any money, does not verify any loan, and does not contact anyone. Records in it are not a legal contract, receipt or proof of debt. Interest figures are simple estimates worked out from the amount, rate and period you choose (no compounding), and may differ from what you actually agreed or from what the law allows, so please check them yourself. You are responsible for using it lawfully, including any rules on lending and interest in your country, and for respecting the privacy of the people whose names you enter. Reminder messages are sent by you, not by the app; please keep them polite and never use them to harass or threaten anyone. Entries created automatically from loans appear in Entries and exports; whether they count in your income, expense and totals depends on a setting you control.</p><h4>10. Recycle bin</h4><p>The Recycle bin is a convenience, not a backup. Deleted records and loans are kept for about 30 days and are then erased permanently; they can also be lost earlier, for example if browser data is cleared or syncing fails. Clearing your data or deleting your account is permanent and immediate: it does not use the Recycle bin, it empties it, and it cannot be undone. Restoring an item puts it back as it was, but if its wallet or category has since changed or been deleted, the app may use another one. Hiding the AI chat button in Settings only hides it.</p><h4>11. News</h4><p>News is supplied by The Guardian through its Open Platform and is for general information only. It is not financial, investment, tax or legal advice, and it may be delayed, incomplete or unavailable at any time. Articles, headlines and pictures belong to The Guardian and its licensors and are subject to their terms. We are not responsible for third-party articles, websites or links, or for the availability of the news service.</p><h4>12. Notifications</h4><p>Notifications are in-app helpers based on the data you enter. They may be late, missing or wrong, for example if your entries are incomplete or your device clock is off, and they are not financial advice. Do not rely on them for payment deadlines; please check your own records. You can turn them off in Settings.</p><h4>13. Availability</h4><p>We may change, pause or stop the app at any time. Data can be lost, for example when browser data is cleared, sync fails, an account is deleted or a forgotten passcode forces data to be erased. The passcode is a privacy lock, not strong security.</p><h4>14. Limitation of liability</h4><p>To the maximum extent allowed by law, the app owner is not liable for indirect or incidental loss, or for loss of data, arising from your use of the app.</p><h4>15. Ending use</h4><p>You can stop using the app at any time or delete your account. We may restrict access if the app is misused.</p><h4>16. Changes</h4><p>We may update these terms. Continued use means you accept the new version.</p><h4>17. Contact</h4><p><a href="mailto:${CONTACT}">${CONTACT}</a></p>`,
bn:`<p><small>শেষ হালনাগাদ: ২৪ অক্টোবর ২০২৬</small></p><h4>১. সম্মতি</h4><p>Budget ব্যবহার করলে আপনি এই শর্তগুলোতে সম্মত হচ্ছেন। সম্মত না হলে অ্যাপটি ব্যবহার করবেন না।</p><h4>২. সেবা</h4><p>Budget Md. Rakib Hossain এর তৈরি একটি বিনামূল্যের ব্যক্তিগত আয়-ব্যয়ের অ্যাপ, যেমন আছে তেমনভাবে (“as is”) দেওয়া হয়। অ্যাপের কোড সম্পূর্ণ Claude AI দিয়ে লেখা, তাই ভুল বা বাগ থাকতে পারে। সেটিংসের “মতামত” দিয়ে জানাতে পারেন।</p><h4>৩. পেশাদার পরামর্শ নয়</h4><p>Budget আর্থিক, কর, হিসাবরক্ষণ বা আইনি পরামর্শ নয়। মোট অঙ্ক ও রিপোর্ট আপনার দেওয়া তথ্যের ওপর নির্ভর করে, তাই নিজে যাচাই করে নিন। সাহায্য পাতা সাধারণ নির্দেশনা দেয়, সব ক্ষেত্র নাও ঢাকতে পারে।</p><h4>৪. আপনার তথ্য ও অ্যাকাউন্ট</h4><p>আপনার তথ্য আপনারই। সঠিকভাবে তথ্য দেওয়া, ডিভাইস ও Google অ্যাকাউন্ট নিরাপদ রাখা এবং নিজের ব্যাকআপ (যেমন PDF বা CSV) রাখার দায়িত্ব আপনার। সেটিংস থেকে ডেটা মুছতে বা প্রোফাইল মেনু থেকে যেকোনো সময় অ্যাকাউন্ট মুছতে পারেন। ডেটা মোছা ও অ্যাকাউন্ট মোছা স্থায়ী, আর ফেরানো যায় না।</p><h4>৫. গ্রহণযোগ্য ব্যবহার</h4><p>অ্যাপের অপব্যবহার করবেন না: অনুমতি ছাড়া প্রবেশ, সেবা বিঘ্নিত করা, নিরাপত্তা এড়িয়ে যাওয়া বা বেআইনি কাজে ব্যবহার করা যাবে না।</p><h4>৬. AI চ্যাট (ঐচ্ছিক)</h4><p>AI চ্যাট ঐচ্ছিক এবং শুধু আপনার নিজের Gemini API Key দিয়ে চলে, যা আপনি Google AI Studio থেকে নেন। কি নিরাপদ রাখা এবং আপনার Google অ্যাকাউন্টের ব্যবহারসীমা বা খরচের দায়িত্ব আপনার। চ্যাট ব্যবহার করলে আপনার মেসেজ ও বাজেট ডেটার সারাংশ Google এর Gemini API তে যায়, এবং তাতে Google এর নিজস্ব শর্ত প্রযোজ্য। পাসওয়ার্ড, কার্ড নম্বর বা অন্য স্পর্শকাতর তথ্য লিখবেন না। AI এর উত্তর ভুল, অসম্পূর্ণ বা পুরোনো হতে পারে। এগুলো আপনার লেখা তথ্যের ভিত্তিতে সাধারণ তথ্য মাত্র, আর্থিক, কর, হিসাবরক্ষণ বা আইনি পরামর্শ নয়, তাই কাজ করার আগে যাচাই করে নিন। চ্যাটের জন্য ইন্টারনেট লাগে এবং Google তাদের সেবা বদলালে বা সীমিত করলে এটি বন্ধ হয়ে যেতে পারে।</p><h4>৭. তৃতীয় পক্ষের সেবা</h4><p>Budget কাজ করার জন্য অন্য কিছু সেবার ওপর নির্ভর করে। অ্যাপ ব্যবহার করা মানে সেগুলোও ব্যবহার করা, এবং তারা যে তথ্য সামলায় তার ওপর তাদের নিজস্ব শর্ত ও গোপনীয়তা নীতি প্রযোজ্য। সেগুলো এখানে পড়তে পারেন:</p><p><b>Google (sign-in, Gemini API, Fonts)</b> — <a href="https://policies.google.com/terms" target="_blank" rel="noopener noreferrer">শর্তাবলি</a> · <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">গোপনীয়তা নীতি</a><br><b>Firebase (login and database)</b> — <a href="https://firebase.google.com/terms" target="_blank" rel="noopener noreferrer">শর্তাবলি</a> · <a href="https://firebase.google.com/support/privacy" target="_blank" rel="noopener noreferrer">গোপনীয়তা নীতি</a><br><b>Gemini API (AI chat)</b> — <a href="https://ai.google.dev/gemini-api/terms" target="_blank" rel="noopener noreferrer">শর্তাবলি</a><br><b>Google Fonts</b> — <a href="https://developers.google.com/fonts/faq/privacy" target="_blank" rel="noopener noreferrer">গোপনীয়তা</a><br><b>Cloudflare (cdnjs and the News proxy on Workers)</b> — <a href="https://www.cloudflare.com/website-terms/" target="_blank" rel="noopener noreferrer">শর্তাবলি</a> · <a href="https://www.cloudflare.com/privacypolicy/" target="_blank" rel="noopener noreferrer">গোপনীয়তা নীতি</a><br><b>Tally (Feedback form)</b> — <a href="https://tally.so/help/terms-conditions" target="_blank" rel="noopener noreferrer">শর্তাবলি</a> · <a href="https://tally.so/help/privacy-policy" target="_blank" rel="noopener noreferrer">গোপনীয়তা নীতি</a><br><b>Tawk.to (Live support)</b> — <a href="https://www.tawk.to/terms-of-service/" target="_blank" rel="noopener noreferrer">শর্তাবলি</a> · <a href="https://www.tawk.to/privacy-policy/" target="_blank" rel="noopener noreferrer">গোপনীয়তা নীতি</a><br><b>FlipHTML5 (eBook)</b> — <a href="https://fliphtml5.com/terms-of-service.php" target="_blank" rel="noopener noreferrer">শর্তাবলি</a> · <a href="https://fliphtml5.com/privacy-policy.php" target="_blank" rel="noopener noreferrer">গোপনীয়তা নীতি</a><br><b>The Guardian Open Platform (News)</b> — <a href="https://open-platform.theguardian.com/terms/" target="_blank" rel="noopener noreferrer">শর্তাবলি</a> · <a href="https://www.theguardian.com/help/terms-of-service" target="_blank" rel="noopener noreferrer">ওয়েবসাইটের শর্ত</a> · <a href="https://www.theguardian.com/info/privacy" target="_blank" rel="noopener noreferrer">গোপনীয়তা নীতি</a><br><b>html2canvas</b> <a href="https://github.com/niklasvh/html2canvas/blob/master/LICENSE" target="_blank" rel="noopener noreferrer">MIT লাইসেন্স</a> · <b>jsPDF</b> <a href="https://github.com/parallax/jsPDF/blob/master/LICENSE" target="_blank" rel="noopener noreferrer">MIT লাইসেন্স</a> (PDF লাইব্রেরি)</p><p>ই-বুক চাপলে তবেই তৃতীয় পক্ষের সাইট FlipHTML5 এ খোলে। লাইভ সাপোর্ট (Tawk.to) ঐচ্ছিক এবং খুললেই কেবল লোড হয়; চ্যাটে যা লেখেন তা Tawk.to ও অ্যাপের মালিকের কাছে যায়, তাই সেখানে পাসওয়ার্ড বা কার্ড নম্বর দেবেন না। এই সেবাগুলো আমাদের নিয়ন্ত্রণে নয় এবং এর দায়ও আমাদের নয়। তাদের শর্ত ও লিংক বদলাতে পারে; সরকারি পাতাগুলো দেখে নিন।</p><h4>৮. কারেন্সি</h4><p>কারেন্সি সেটিং শুধু চিহ্ন বদলায়। আগের অঙ্ক রূপান্তর হয় না।</p><h4>৯. লোন ট্র্যাকার</h4><p>লোন ট্র্যাকার আপনার নিজের ব্যক্তিগত হিসাব রাখার একটি ঐচ্ছিক সহায়ক। এটি কোনো ঋণ সেবা নয়: অ্যাপ কোনো টাকা ধার দেয় না, আদায় করে না, পাঠায় না, জমা রাখে না বা স্থানান্তর করে না, কোনো লোন যাচাই করে না এবং কারো সাথে যোগাযোগ করে না। এখানকার রেকর্ড কোনো আইনি চুক্তি, রসিদ বা দেনার প্রমাণ নয়। সুদের অঙ্ক আপনার দেওয়া পরিমাণ, হার ও সময় থেকে হিসাব করা সরল সুদের আনুমানিক অঙ্ক (চক্রবৃদ্ধি নয়), যা আপনাদের আসল চুক্তি বা আইনের সীমা থেকে আলাদা হতে পারে, তাই নিজে যাচাই করে নিন। আইনসম্মতভাবে ব্যবহার করা, আপনার দেশে ঋণ ও সুদ সংক্রান্ত নিয়ম মানা এবং যাদের নাম লেখেন তাদের গোপনীয়তার প্রতি শ্রদ্ধা রাখা আপনার দায়িত্ব। তাগাদার মেসেজ অ্যাপ নয়, আপনি নিজে পাঠান; ভদ্র ভাষা রাখুন এবং কাউকে হয়রানি বা হুমকি দিতে ব্যবহার করবেন না। লোন থেকে নিজে থেকে তৈরি হওয়া এন্ট্রি লেনদেন ও এক্সপোর্টে দেখায়; আয়, খরচ ও মোটে গোনা হবে কিনা তা আপনার একটি সেটিংয়ের ওপর নির্ভর করে।</p><h4>১০. রিসাইকেল বিন</h4><p>রিসাইকেল বিন একটি সুবিধা মাত্র, ব্যাকআপ নয়। মুছে ফেলা রেকর্ড ও লোন প্রায় ৩০ দিন থাকে, তারপর স্থায়ীভাবে মুছে যায়; তার আগেও হারিয়ে যেতে পারে, যেমন ব্রাউজারের ডেটা মুছলে বা সিঙ্ক ব্যর্থ হলে। ডেটা মোছা বা অ্যাকাউন্ট মোছা স্থায়ী ও তাৎক্ষণিক: এটি রিসাইকেল বিনে যায় না, বরং বিন খালি করে দেয়, এবং আর ফেরানো যায় না। কোনো কিছু ফিরিয়ে আনলে আগের মতো ফেরে, তবে এর ওয়ালেট বা ক্যাটাগরি বদলে গেলে বা মুছে গেলে অ্যাপ অন্য একটি ব্যবহার করতে পারে। সেটিংসে AI চ্যাট বাটন লুকালে শুধু বাটনই লুকায়।</p><h4>১১. খবর</h4><p>খবর The Guardian তাদের Open Platform এর মাধ্যমে দেয় এবং এটি শুধু সাধারণ তথ্যের জন্য। এটি আর্থিক, বিনিয়োগ, কর বা আইনি পরামর্শ নয়, এবং যেকোনো সময় দেরিতে আসতে, অসম্পূর্ণ হতে বা বন্ধ থাকতে পারে। খবরের লেখা, শিরোনাম ও ছবি The Guardian ও তাদের লাইসেন্সদাতাদের এবং তাদের শর্তের অধীন। তৃতীয় পক্ষের খবর, ওয়েবসাইট বা লিংকের দায় এবং খবর সেবা চালু থাকার দায় আমাদের নয়।</p><h4>১২. নোটিফিকেশন</h4><p>নোটিফিকেশন হলো আপনার দেওয়া তথ্যের ওপর ভিত্তি করা অ্যাপের ভেতরের সহায়ক। আপনার এন্ট্রি অসম্পূর্ণ বা ডিভাইসের ঘড়ি ভুল হলে এগুলো দেরিতে আসতে, বাদ পড়তে বা ভুল হতে পারে, এবং এগুলো আর্থিক পরামর্শ নয়। পরিশোধের শেষ তারিখের জন্য এগুলোর ওপর নির্ভর করবেন না; নিজের রেকর্ড দেখে নিন। সেটিংসে এগুলো বন্ধ করা যায়।</p><h4>১৩. সেবার প্রাপ্যতা</h4><p>আমরা যেকোনো সময় অ্যাপ বদলাতে, সাময়িক বা স্থায়ীভাবে বন্ধ করতে পারি। ব্রাউজারের ডেটা মুছলে, সিঙ্ক ব্যর্থ হলে, অ্যাকাউন্ট মুছলে বা পাসকোড ভুলে ডেটা মুছতে হলে তথ্য হারিয়ে যেতে পারে। পাসকোড একটি গোপনীয়তার লক, শক্তিশালী নিরাপত্তা নয়।</p><h4>১৪. দায়ের সীমা</h4><p>আইনে যতটুকু অনুমোদিত, অ্যাপ ব্যবহারের ফলে হওয়া পরোক্ষ ক্ষতি বা তথ্য হারানোর দায় অ্যাপের মালিকের নয়।</p><h4>১৫. ব্যবহার বন্ধ</h4><p>আপনি যেকোনো সময় ব্যবহার বন্ধ করতে বা অ্যাকাউন্ট মুছতে পারেন। অপব্যবহার হলে আমরা প্রবেশ সীমিত করতে পারি।</p><h4>১৬. পরিবর্তন</h4><p>আমরা শর্ত হালনাগাদ করতে পারি। ব্যবহার চালিয়ে গেলে নতুন সংস্করণে সম্মতি ধরা হবে।</p><h4>১৭. যোগাযোগ</h4><p><a href="mailto:${CONTACT}">${CONTACT}</a></p>`}};
