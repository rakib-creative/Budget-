['Insights and AI chat','বিশ্লেষণ ও AI চ্যাট',[
['What do the Insights show?','Pick a view from the drop-down: Expense or Income overview (donut chart by category, plus a trend chart and table of recent periods), Expense or Income flow (daily line chart and calendar) and Account analysis (income and expense per wallet). Use the filter icon to change the period.','বিশ্লেষণ ট্যাবে কী দেখা যায়?','ড্রপডাউন থেকে বেছে নিন: খরচ বা আয়ের সারসংক্ষেপ (ক্যাটাগরি অনুযায়ী ডোনাট চার্ট এবং সাম্প্রতিক সময়ের ট্রেন্ড চার্ট ও টেবিল), খরচ বা আয়ের প্রবাহ (দৈনিক লাইন চার্ট ও ক্যালেন্ডার) এবং অ্যাকাউন্ট বিশ্লেষণ (ওয়ালেট অনুযায়ী আয়-খরচ)। সময়কাল বদলাতে ফিল্টার আইকন ব্যবহার করুন।'],
['What is the AI chat and how do I set it up?','On the Insights tab tap the ✨ button. It is red until you add your own free Gemini API key (get one from Google AI Studio) and turns green once a key is saved. Then pick a ready-made prompt or ask your own question about your income, spending, budgets and wallets.','AI চ্যাট কী এবং কীভাবে চালু করব?','বিশ্লেষণ ট্যাবের ✨ বাটনে চাপুন। নিজের ফ্রি Gemini API Key (Google AI Studio থেকে) না দেওয়া পর্যন্ত এটি লাল থাকে, key সেভ হলে সবুজ হয়। এরপর তৈরি প্রম্পট বেছে নিন বা আপনার আয়, খরচ, বাজেট ও ওয়ালেট নিয়ে নিজের প্রশ্ন লিখুন।'],
['How do I choose the period for AI analysis?','Open the AI chat and tap Daily, Weekly, Monthly, 3 months, 6 months or Yearly under the title. Monthly is recommended: longer periods send much more data and may hit the free Gemini limit or fail. Ready-made prompts like Next month, vs last period, 3-month plan, Goal plan and Weekly plan use your data to forecast and plan.','AI বিশ্লেষণের সময়কাল কীভাবে বাছব?','AI চ্যাট খুলে শিরোনামের নিচে দৈনিক, সাপ্তাহিক, মাসিক, ৩ মাস, ৬ মাস বা বার্ষিক চাপুন। মাসিক ব্যবহার করার পরামর্শ: লম্বা সময়ে অনেক বেশি ডেটা যায়, তাই ফ্রি Gemini সীমা শেষ হতে বা এরর আসতে পারে। আগামী মাস, আগের সময়ের সাথে, ৩ মাসের পরিকল্পনা, লক্ষ্য ও সাপ্তাহিক পরিকল্পনার মতো তৈরি প্রম্পট আপনার ডেটা দিয়ে পূর্বাভাস ও পরিকল্পনা বানায়।'],
['What does the AI see, and is my key safe?','Only when you send a message, a summary of the period you picked in the chat (totals, categories, previous-period comparison, last 6 months, budgets, wallets and up to 500 recent records with notes) goes from your device straight to Google Gemini using your key. The key stays in your browser only. By default it is forgotten when you close the app; tick “Remember on this device” to keep it. You can remove it anytime with the 🔑 button in the chat.','AI কী কী দেখতে পায়, আর আমার key কি নিরাপদ?','আপনি মেসেজ পাঠালে তবেই চ্যাটে বেছে নেওয়া সময়ের সারাংশ (মোট অঙ্ক, ক্যাটাগরি, আগের সময়ের তুলনা, গত ৬ মাস, বাজেট, ওয়ালেট ও নোটসহ সাম্প্রতিক সর্বোচ্চ ৫০০টি রেকর্ড) আপনার ডিভাইস থেকে আপনার key দিয়ে সরাসরি Google Gemini তে যায়। key শুধু আপনার ব্রাউজারে থাকে। ডিফল্টভাবে অ্যাপ বন্ধ করলে মুছে যায়; রাখতে চাইলে “এই ডিভাইসে মনে রাখো” টিক দিন। চ্যাটের 🔑 বাটন দিয়ে যেকোনো সময় মুছতে পারেন।'],
['Why does the AI button do nothing, or show an error?','The AI chat needs internet. When you are offline the button is dimmed and does nothing. If you see an API key error, tap 🔑 in the chat and paste a valid key.','AI বাটনে চাপলে কিছু হয় না বা ত্রুটি আসে কেন?','AI চ্যাটের জন্য ইন্টারনেট লাগে। অফলাইনে বাটন ঝাপসা থাকে ও কিছু হয় না। API key এর ত্রুটি এলে চ্যাটের 🔑 চেপে সঠিক key দিন।']]],
['Budgets, wallets and categories','বাজেট, ওয়ালেট ও ক্যাটাগরি',[
['How do I set a budget?','Open the Budgets tab, tap a category and enter the monthly amount. The bar shows how much you have spent this month and how much is left or over. Leave it blank or enter 0 to remove it.','বাজেট ঠিক করব কীভাবে?','বাজেট ট্যাবে ক্যাটাগরিতে চেপে মাসিক পরিমাণ দিন। বার দেখায় এই মাসে কত খরচ হয়েছে, কত বাকি বা বেশি। খালি রাখলে বা ০ দিলে বাজেট বন্ধ হয়।'],
['How do wallets work?','Wallets (cash, bank, mobile banking and so on) hold your balance. Add one with + on the Wallets tab, set an opening balance, and tap a wallet to see its records. Balance = opening balance + income − expense, adjusted by transfers.','ওয়ালেট কীভাবে কাজ করে?','ওয়ালেটে (নগদ, ব্যাংক, মোবাইল ব্যাংকিং ইত্যাদি) আপনার ব্যালেন্স থাকে। ওয়ালেট ট্যাবে + চেপে যোগ করুন, শুরুর ব্যালেন্স দিন, আর ওয়ালেটে চাপলে তার রেকর্ড দেখা যায়। ব্যালেন্স = শুরুর ব্যালেন্স + আয় − খরচ, ট্রান্সফার মিলিয়ে।'],
['Why can’t I delete a wallet or category?','A wallet or category that already has records can’t be deleted, and your last wallet can’t be deleted. Edit or delete those records first, or just rename it.','ওয়ালেট বা ক্যাটাগরি মুছতে পারছি না কেন?','যে ওয়ালেট বা ক্যাটাগরিতে রেকর্ড আছে তা মোছা যায় না, আর শেষ ওয়ালেটও মোছা যায় না। আগে ওই রেকর্ডগুলো বদলান বা মুছুন, অথবা শুধু নাম বদলে নিন।'],
['Can I make my own categories?','Yes. On the Categories tab tap +, choose Expense or Income, then pick a name, emoji and color.','নিজের ক্যাটাগরি বানানো যায়?','হ্যাঁ। ক্যাটাগরি ট্যাবে + চেপে খরচ বা আয় বেছে নাম, ইমোজি ও রং দিন।'],
]],
['Loan tracker','লোন ট্র্যাকার',[
['What is the Loan tracker and how do I turn it on?','It keeps track of money you borrowed from someone or lent to someone, including repayments, due dates and interest. It is off by default. Go to Settings, switch Loan tracker to On, and a small 🤝 button appears above the + button on the Entries, Wallets and Categories tabs (it hides while you scroll down and returns when you scroll up). A summary of what you owe and are owed also shows right under your income and expense totals; tap it to open Loans. Turn it Off the same way; this only hides it and keeps your data.','লোন ট্র্যাকার কী এবং কীভাবে চালু করব?','কারো কাছ থেকে ধার নিলে বা কাউকে ধার দিলে তার হিসাব, পরিশোধ, ফেরতের তারিখ ও সুদসহ এখানে রাখা যায়। এটি শুরুতে বন্ধ থাকে। সেটিংসে গিয়ে লোন ট্র্যাকার চালু করলে লেনদেন, ওয়ালেট ও ক্যাটাগরি ট্যাবে + বাটনের উপরে ছোট 🤝 বাটন আসে (নিচে স্ক্রল করলে লুকায়, উপরে উঠলে ফেরে)। আয়-খরচের মোটের ঠিক নিচে দেনা-পাওনার সারসংক্ষেপও দেখায়; চাপলে লোন পাতা খোলে। একইভাবে বন্ধ করা যায়; বন্ধ করলে শুধু লুকানো থাকে, ডেটা থেকে যায়।'],
['How do I add a loan?','Tap 🤝, then “+ New”. Choose “I borrowed” (you will repay) or “I lent” (you will receive). Type the name (or tap a recent name), the amount, and pick the wallet. Optionally set a due date with one tap (+1 week, +1 month and so on), add interest, a repayment plan (installments) or a note, then Save.','লোন কীভাবে যোগ করব?','🤝 চেপে “+ নতুন” চাপুন। “আমি নিয়েছি” (আপনি ফেরত দেবেন) বা “আমি দিয়েছি” (আপনি ফেরত পাবেন) বেছে নিন। নাম লিখুন (বা আগের কোনো নামে চাপুন), পরিমাণ দিন এবং ওয়ালেট বাছুন। চাইলে এক চাপে মেয়াদ (+১ সপ্তাহ, +১ মাস ইত্যাদি), সুদ, কিস্তির পরিকল্পনা ও নোট দিয়ে সেভ করুন।'],
['What is the difference between “I borrowed” and “I lent”?','“I borrowed” means you took money from someone and owe it, so it counts under “I owe” in red. “I lent” means you gave money to someone and will get it back, so it counts under “Owed to me” in green.','“আমি নিয়েছি” আর “আমি দিয়েছি” এর পার্থক্য কী?','“আমি নিয়েছি” মানে আপনি কারো কাছ থেকে টাকা নিয়েছেন ও ফেরত দেবেন, এটি লাল রঙে “দেনা” তে গোনা হয়। “আমি দিয়েছি” মানে আপনি কাউকে টাকা দিয়েছেন ও ফেরত পাবেন, এটি সবুজ রঙে “পাওনা” তে গোনা হয়।'],
['What happens to my wallet and Entries when I add a loan?','If you pick a wallet, the balance changes right away and an entry is added to your Entries automatically: “Loan taken” (income) or “Loan given” (expense). Repayments add “Loan repaid” (expense) or “Loan received back” (income). Your wallet balance therefore stays correct. If you choose “No wallet”, only the loan record is kept and no entry is added.','লোন যোগ করলে আমার ওয়ালেট ও লেনদেনে কী হয়?','ওয়ালেট বাছলে ব্যালেন্স সাথে সাথে বদলায় এবং লেনদেনে নিজে থেকে এন্ট্রি যোগ হয়: “লোন নেওয়া” (আয়) বা “লোন দেওয়া” (খরচ)। পরিশোধ করলে “লোন পরিশোধ” (খরচ) বা “লোন ফেরত পাওয়া” (আয়) যোগ হয়। তাই ওয়ালেটের ব্যালেন্স ঠিক থাকে। “ওয়ালেট নেই” বাছলে শুধু লোনের রেকর্ড থাকে, কোনো এন্ট্রি হয় না।'],
['Are loans counted as my real income or expense?','No. A loan is a debt, not income, so by default loan entries are NOT counted in Income, Expense or Total, nor in Insights and Reports. They still appear in Entries and change your wallet balances so the money you hold is correct. If you would rather count them, turn on “Count loans in income & expense” in Settings (under Loan tracker).','লোন কি আমার আসল আয় বা খরচ হিসেবে গোনা হয়?','না। লোন দেনা, আয় নয়, তাই ডিফল্টভাবে লোনের এন্ট্রি আয়, খরচ বা মোটে এবং বিশ্লেষণ ও রিপোর্টে গোনা হয় না। তবে লেনদেনে দেখায় এবং ওয়ালেটের ব্যালেন্স বদলায়, যাতে আপনার হাতে থাকা টাকার হিসাব ঠিক থাকে। চাইলে সেটিংসে (লোন ট্র্যাকারের নিচে) “লোনকে আয়-খরচে ধরুন” চালু করলে গোনা হবে।'],
['How do I record a repayment?','On the loan card tap “+ Repay” (or “+ Receive” for money you lent). Type the amount, or tap “Full” or “Half”, pick Today, Yesterday or a date, choose the wallet and Save. You can make as many part payments as you like. Open the loan to see every payment, and tap one to edit or delete it.','পরিশোধ কীভাবে লিখব?','লোনের কার্ডে “+ পরিশোধ” (ধার দিয়ে থাকলে “+ আদায়”) চাপুন। পরিমাণ লিখুন, অথবা “পুরোটা” বা “অর্ধেক” চাপুন, আজ, গতকাল বা তারিখ বেছে ওয়ালেট ঠিক করে সেভ করুন। যতবার খুশি অল্প অল্প করে পরিশোধ করা যায়। লোন খুললে সব পরিশোধ দেখা যায়, কোনোটিতে চাপলে এডিট বা মোছা যায়।'],
['Can I pay more than what is left?','No. A payment cannot be more than the remaining amount, including interest. Tap “Full” to fill in the exact remaining amount.','বাকির চেয়ে বেশি পরিশোধ করা যায়?','না। সুদসহ বাকি অঙ্কের বেশি পরিশোধ দেওয়া যায় না। ঠিক বাকি অঙ্ক বসাতে “পুরোটা” চাপুন।'],
['How does interest work?','Choose “Add interest”, type the rate in %, and pick how often it is charged: daily, weekly, monthly, every 3 months, every 6 months, yearly, or one-time. Interest is simple (not compound) and is worked out on the original amount for the time that has passed, for example 2% monthly on 10,000 adds 200 each month. “One-time” adds a fixed amount once. The form shows a live preview, and the loan page shows the interest so far and the total. Interest stops growing once the loan is fully paid or settled.','সুদ কীভাবে কাজ করে?','“সুদ আছে” বেছে হার (%) লিখুন এবং কত সময় পরপর ধরা হবে তা বাছুন: দৈনিক, সাপ্তাহিক, মাসিক, ৩ মাস, ৬ মাস, বাৎসরিক বা একবার। সুদ সরল (চক্রবৃদ্ধি নয়) এবং আসল টাকার ওপর যতদিন গেছে সেই হিসাবে হয়, যেমন ১০,০০০ টাকায় মাসিক ২% হলে প্রতি মাসে ২০০ যোগ হয়। “একবার” বাছলে নির্দিষ্ট অঙ্ক একবারই যোগ হয়। ফর্মে লাইভ হিসাব দেখা যায় এবং লোনের পাতায় এখন পর্যন্ত সুদ ও মোট দেখা যায়। পুরো পরিশোধ বা লোন বন্ধ হলে সুদ আর বাড়ে না।'],
['Is the interest figure exact?','It is an estimate based on the rate and period you entered. Your real agreement or local law may calculate it differently, so check it yourself.','সুদের অঙ্ক কি একদম নির্ভুল?','এটি আপনার দেওয়া হার ও সময়ের ভিত্তিতে একটি আনুমানিক হিসাব। আপনাদের আসল চুক্তি বা দেশের আইনে হিসাব আলাদা হতে পারে, তাই নিজে যাচাই করে নিন।'],
['How do due dates and overdue warnings work?','Each card shows “5 days left”, “Due today” or “2 days overdue”. Loans that are due soonest are listed first, and a red notice at the top of the Loans page tells you how many are overdue. The app does not send notifications by itself.','ফেরতের তারিখ ও মেয়াদ পার সতর্কতা কীভাবে কাজ করে?','প্রতিটি কার্ডে “৫ দিন বাকি”, “আজ শেষ দিন” বা “২ দিন মেয়াদ পার” দেখায়। যে লোনের মেয়াদ আগে শেষ হবে সেটি আগে থাকে, আর লোন পাতার উপরে লাল বার্তায় কয়টি লোনের মেয়াদ পার হয়েছে তা দেখায়। অ্যাপ নিজে থেকে কোনো নোটিফিকেশন পাঠায় না।'],
['How do I settle or close a loan?','A loan is marked Settled automatically when it is fully paid. If you want to close it with some amount still unpaid (for example it was forgiven), open it and tap Settle. Settled loans move to the “Settled” tab, and you can reopen a loan you closed by mistake.','লোন কীভাবে শোধ বা বন্ধ করব?','পুরোটা পরিশোধ হলে লোন নিজে থেকেই “পরিশোধিত” হয়ে যায়। কিছু বাকি রেখেই বন্ধ করতে চাইলে (যেমন মাফ করে দিলে) লোন খুলে “বন্ধ করুন” চাপুন। পরিশোধিত লোন “পরিশোধিত” ট্যাবে চলে যায়, ভুল করে বন্ধ করলে আবার চালু করা যায়।'],
['What is the Remind button?','For money you lent, the loan page has a 📩 Remind button. It prepares a polite message with the name, the amount left and the due date. You can share it with WhatsApp, SMS or any app, or it is copied if sharing is not available. The app never sends anything by itself.','তাগাদা বাটন কী?','যাকে ধার দিয়েছেন তার লোনের পাতায় 📩 তাগাদা বাটন থাকে। এটি নাম, বাকি অঙ্ক ও ফেরতের তারিখসহ একটি ভদ্র মেসেজ তৈরি করে। আপনি সেটি WhatsApp, SMS বা যেকোনো অ্যাপে শেয়ার করতে পারেন, শেয়ার না চললে কপি হয়ে যায়। অ্যাপ নিজে থেকে কিছু পাঠায় না।'],
['How do I find, filter or edit a loan?','Use the tabs All, I owe and Owed to me, and Active or Settled. The search box finds a name or note. Open a loan and tap ✎ to edit it, or delete it from the edit screen. Deleting a loan also removes the entries it created, and the wallet balance is corrected.','লোন কীভাবে খুঁজব, ফিল্টার বা এডিট করব?','সব, দেনা, পাওনা এবং চলমান বা পরিশোধিত ট্যাব ব্যবহার করুন। সার্চ বক্সে নাম বা নোট দিয়ে খোঁজা যায়। লোন খুলে ✎ চেপে এডিট করুন, মুছতে চাইলে এডিট পাতা থেকে মুছুন। লোন মুছলে সেটির তৈরি করা এন্ট্রিও মুছে যায় এবং ওয়ালেটের ব্যালেন্স ঠিক হয়ে যায়।'],
['Can I edit or delete the loan entries in my Entries list?','Tap one and press 🗑️ to delete it (a loan entry deletes the loan, a repayment entry deletes that payment), or 🤝 to open the loan and edit it. This keeps the loan and your entries in step, so they cannot go out of sync.','লেনদেনের তালিকায় থাকা লোনের এন্ট্রি কি এডিট বা মুছতে পারি?','এন্ট্রিতে চেপে 🗑️ দিলে মোছা যায় (লোনের এন্ট্রি মুছলে লোন মুছে যায়, পরিশোধের এন্ট্রি মুছলে সেই পরিশোধ), আর 🤝 চেপে লোন খুলে এডিট করা যায়। এতে লোন ও আপনার এন্ট্রি সবসময় মিলে থাকে।'],
['Why can’t I delete a wallet that has a loan?','A wallet used by a loan or a repayment is in use, like one with records. Change or delete that loan first, then delete the wallet.','লোন আছে এমন ওয়ালেট কেন মুছতে পারছি না?','যে ওয়ালেট কোনো লোন বা পরিশোধে ব্যবহার হয়েছে সেটি রেকর্ডসহ ওয়ালেটের মতোই ব্যবহৃত। আগে ওই লোন বদলান বা মুছুন, তারপর ওয়ালেট মুছুন।'],
['Does the Loan tracker sync, and is it in my reports?','Yes. Loan data syncs with your account like everything else when you are signed in. The entries it creates appear in reports, PDF and CSV. The loan details themselves (interest, repayment list) are shown only in the Loan tracker.','লোন ট্র্যাকারের ডেটা কি সিঙ্ক হয় ও রিপোর্টে আসে?','হ্যাঁ। লগইন থাকলে লোনের ডেটা অন্য সব কিছুর মতোই অ্যাকাউন্টে সিঙ্ক হয়। এটি যে এন্ট্রি বানায় তা রিপোর্ট, PDF ও CSV তে আসে। তবে লোনের বিস্তারিত (সুদ, পরিশোধের তালিকা) শুধু লোন ট্র্যাকারেই দেখা যায়।'],
['What happens to my loans if I turn the tracker off?','Nothing is deleted. The 🤝 button, the Loans bar and the “Net after loans” line are hidden, but your loans stay saved and their entries stay in Entries. Wallet balances do not change. Income, Expense, Total, Insights and Reports keep following your “Count loans in income & expense” choice, and that option stays in Settings while you have saved loans. Turn the tracker on again to see everything.','ট্র্যাকার বন্ধ করলে লোনের কী হয়?','কিছু মুছে যায় না। 🤝 বাটন, লোন বার ও “লোনের পর নিট” লাইন লুকানো থাকে, কিন্তু লোন সেভ থাকে এবং এন্ট্রিগুলো লেনদেনে থাকে। ওয়ালেটের ব্যালেন্স বদলায় না। আয়, খরচ, মোট, বিশ্লেষণ ও রিপোর্ট আপনার “লোনকে আয়-খরচে ধরুন” বাছাই অনুযায়ীই চলে, এবং সেভ করা লোন থাকলে সেই অপশন সেটিংসে থাকে। আবার চালু করলে সবকিছু দেখা যাবে।'],
['How do I set up installments (a repayment plan)?','When adding or editing a loan, under “Repayment plan” tap “Set installments”. Type either the number of installments or the amount of each one (the other fills in by itself), choose how often you pay (daily, weekly, monthly, every 3 months, every 6 months or yearly) and when the first one is due. The form shows how many installments there will be and the first and last dates.','কিস্তি (পরিশোধের পরিকল্পনা) কীভাবে ঠিক করব?','লোন যোগ বা এডিটের সময় “কিস্তির পরিকল্পনা” এ “কিস্তি ঠিক করুন” চাপুন। কিস্তির সংখ্যা অথবা প্রতি কিস্তির পরিমাণ যেকোনো একটি লিখুন (অন্যটি নিজে ভরে যায়), কত সময় পরপর দেবেন (দৈনিক, সাপ্তাহিক, মাসিক, ৩ মাস, ৬ মাস বা বাৎসরিক) এবং প্রথম কিস্তি কবে তা বাছুন। ফর্মেই দেখা যায় মোট কয়টি কিস্তি হবে এবং প্রথম ও শেষ তারিখ।'],
['Where can I see how much I must pay each month or day?','On each loan card a line such as “Next installment ৳2,000 · 30 Nov” shows the amount and date of the next installment. Open the loan to see the whole plan: the amount per installment and how often, the next date, about how many are left, and whether you are on track or behind. When you repay, a quick “Installment” chip fills in the amount for you.','প্রতি মাসে বা দিনে কত দিতে হবে তা কোথায় দেখব?','প্রতিটি লোনের কার্ডে “পরের কিস্তি ৳২,০০০ · ৩০ নভেম্বর” এর মতো লাইনে পরের কিস্তির অঙ্ক ও তারিখ দেখায়। লোন খুললে পুরো পরিকল্পনা দেখা যায়: প্রতি কিস্তির অঙ্ক ও কত সময় পরপর, পরের তারিখ, প্রায় কয়টি বাকি এবং ঠিক আছে নাকি পিছিয়ে আছেন। পরিশোধের সময় “কিস্তি” চিপ চাপলে অঙ্ক নিজে বসে যায়।'],
['What does “Behind” mean?','If installment dates have passed and you have paid less than the plan requires, the card shows “⚠ Behind ৳X” in red and the Loans page counts it in the red notice. Paying that amount brings you back on track.','“বাকি পড়েছে” মানে কী?','কিস্তির তারিখ পেরিয়ে গেছে অথচ পরিকল্পনা অনুযায়ী যতটা দেওয়ার কথা তার কম দিয়েছেন, তখন কার্ডে লাল রঙে “⚠ বাকি পড়েছে ৳X” দেখায় এবং লোন পাতার লাল বার্তায় গোনা হয়। সেই অঙ্ক পরিশোধ করলে আবার ঠিক হয়ে যায়।'],
['What is the loan summary under my income and expense totals?','When the Loan tracker is on, a slim bar under the totals shows how much you owe (red) and how much is owed to you (green) across all active loans. Tap it to open Loans. It is a separate summary and is not added into your income and expense totals above it.','আয়-খরচের মোটের নিচের লোন সারসংক্ষেপ কী?','লোন ট্র্যাকার চালু থাকলে মোট অঙ্কের নিচে একটি সরু বারে সব চলমান লোন মিলিয়ে আপনি কত দেবেন (লাল) ও কত পাবেন (সবুজ) তা দেখায়। চাপলে লোন পাতা খোলে। এটি আলাদা সারসংক্ষেপ, উপরের আয়-খরচের মোটের সাথে যোগ হয় না।'],
['Why does the 🤝 button disappear when I scroll?','So it stays out of the way while you read your list. Scroll up a little and it comes back.','স্ক্রল করলে 🤝 বাটন কেন লুকিয়ে যায়?','তালিকা পড়ার সময় যাতে বাধা না দেয়। একটু উপরে স্ক্রল করলেই আবার ফিরে আসে।'],
['How do I extend a due date?','Open the loan and tap “📅 Extend due”. Pick +1 week, +1 month, +3 months, +6 months or a date of your own, or remove the due date, then Save. The new date is counted from the current due date (or from today if that has already passed).','মেয়াদ কীভাবে বাড়াব?','লোন খুলে “📅 মেয়াদ বাড়ান” চাপুন। +১ সপ্তাহ, +১ মাস, +৩ মাস, +৬ মাস বা নিজের পছন্দের তারিখ বাছুন, অথবা মেয়াদ সরিয়ে দিন, তারপর সেভ করুন। নতুন তারিখ বর্তমান মেয়াদ থেকে গোনা হয় (মেয়াদ পেরিয়ে গেলে আজ থেকে)।'],
['What is the Statement button?','It prepares a short summary of the loan: the name, amount, interest, due date, every payment and what is left. Share it on WhatsApp, SMS or any app, or it is copied if sharing is not available. It is handy for settling accounts with the other person.','স্টেটমেন্ট বাটন কী?','এটি লোনের একটি ছোট সারসংক্ষেপ তৈরি করে: নাম, পরিমাণ, সুদ, মেয়াদ, প্রতিটি পরিশোধ ও কত বাকি। WhatsApp, SMS বা যেকোনো অ্যাপে শেয়ার করা যায়, শেয়ার না চললে কপি হয়ে যায়। অপর পক্ষের সাথে হিসাব মেলাতে কাজে লাগে।'],
['Can I delete a loan entry in Entries?','Entries such as “Loan taken” or “Loan repaid” are created automatically from your loans, so they cannot be edited in Entries. Tap one and press 🗑️ to delete it: deleting the “Loan taken/given” entry deletes the whole loan (it goes to the Recycle bin), and deleting a repayment entry removes just that payment. To change anything, use 🤝 “Open loan”.','লেনদেন থেকে লোনের এন্ট্রি কি মুছতে পারি?','“লোন নেওয়া” বা “লোন পরিশোধ” এর মতো এন্ট্রি আপনার লোন থেকে নিজে তৈরি হয়, তাই লেনদেনে এগুলো এডিট করা যায় না। এন্ট্রিতে চেপে 🗑️ দিলে মোছা যায়: “লোন নেওয়া/দেওয়া” এন্ট্রি মুছলে পুরো লোন মুছে যায় (রিসাইকেল বিনে যায়), আর পরিশোধের এন্ট্রি মুছলে শুধু সেই পরিশোধ মুছে যায়। কিছু বদলাতে 🤝 “লোন খুলুন” ব্যবহার করুন।'],
['Why don’t the loan categories appear in Budgets or Categories?','Loan taken, Loan repaid, Loan given and Loan received back are automatic categories used only by loan entries. They are hidden from the Budgets and Categories tabs and from the category list when you add a record, so they cannot be edited, deleted or given a budget. They still show in Entries, and in Insights and Reports only if you turn on “Count loans in income & expense”.','লোনের ক্যাটাগরি বাজেট বা ক্যাটাগরি ট্যাবে কেন দেখায় না?','লোন নেওয়া, লোন পরিশোধ, লোন দেওয়া ও লোন ফেরত পাওয়া স্বয়ংক্রিয় ক্যাটাগরি, যা শুধু লোনের এন্ট্রিতে ব্যবহার হয়। তাই এগুলো বাজেট ও ক্যাটাগরি ট্যাবে এবং রেকর্ড যোগের ক্যাটাগরি তালিকায় লুকানো থাকে; এডিট, মোছা বা বাজেট দেওয়া যায় না। লেনদেনে এগুলো দেখা যায়; বিশ্লেষণ ও রিপোর্টে তখনই ধরা হয় যখন “লোনকে আয়-খরচে ধরুন” চালু করেন।'],
['What does “Count loans in income & expense” do?','It is in Settings under Loan tracker (visible when the tracker is on). Off, the default: loan money shows in Entries and changes wallet balances, but Income, Expense and Total ignore it. On: loan entries are counted like normal income and expense, so “Loan taken” raises Income and “Loan repaid” raises Expense.','“লোনকে আয়-খরচে ধরুন” অপশনটি কী করে?','এটি সেটিংসে লোন ট্র্যাকারের নিচে আছে (ট্র্যাকার চালু থাকলে দেখা যায়)। বন্ধ থাকলে (ডিফল্ট) লোনের টাকা লেনদেনে দেখায় ও ওয়ালেটের ব্যালেন্স বদলায়, কিন্তু আয়, খরচ ও মোটে ধরা হয় না। চালু করলে লোনের এন্ট্রি সাধারণ আয়-খরচের মতো গোনা হয়, তখন “লোন নেওয়া” আয় আর “লোন পরিশোধ” খরচ বাড়ায়।'],
['What exactly changes when I turn “Count loans in income & expense” On or Off?','Off (default): loan entries still appear in Entries and change your wallet balances, but Income, Expense, Total, Insights, Reports, the monthly summary and the AI chat leave them out. The only exception is interest: when you repay more than you borrowed (or receive more than you lent), the extra part is counted as “Loan interest paid” (expense) or “Loan interest received” (income), because that is a real cost or gain. On: every loan entry is counted in full, so “Loan taken” adds to Income and “Loan repaid” adds to Expense.','“লোনকে আয়-খরচে ধরুন” চালু বা বন্ধ করলে ঠিক কী বদলায়?','বন্ধ (ডিফল্ট): লোনের এন্ট্রি লেনদেনে দেখায় ও ওয়ালেটের ব্যালেন্স বদলায়, কিন্তু আয়, খরচ, মোট, বিশ্লেষণ, রিপোর্ট, মাসের সারসংক্ষেপ ও AI চ্যাট থেকে বাদ থাকে। একমাত্র ব্যতিক্রম সুদ: যতটা ধার নিয়েছিলেন তার বেশি ফেরত দিলে (বা ধার দেওয়ার বেশি ফেরত পেলে) বাড়তি অংশ “লোনের সুদ (দেওয়া)” খরচ বা “লোনের সুদ (পাওয়া)” আয় হিসেবে ধরা হয়, কারণ সেটা আসল খরচ বা লাভ। চালু: প্রতিটি লোনের এন্ট্রি পুরো অঙ্কে গোনা হয়, তখন “লোন নেওয়া” আয়ে আর “লোন পরিশোধ” খরচে যোগ হয়।'],
['Are my reports correct when the option is Off?','Yes. The totals, category tables and charts in Reports follow the same rule as the rest of the app: loan entries are left out (except the interest part). The transaction list still shows every entry so nothing is hidden, and loan rows are tagged “not counted” or “only interest counted”. A note under the list explains it. The CSV file has an extra “Counted in totals” column (Yes / No / Interest only) so you can filter it yourself.','অপশন বন্ধ থাকলে কি রিপোর্ট ঠিক থাকে?','হ্যাঁ। রিপোর্টের মোট অঙ্ক, ক্যাটাগরির টেবিল ও চার্ট অ্যাপের বাকি অংশের একই নিয়ম মানে: লোনের এন্ট্রি বাদ যায় (সুদের অংশ ছাড়া)। লেনদেনের তালিকায় সব এন্ট্রিই থাকে, কিছু লুকানো হয় না, আর লোনের সারিতে “গোনা হয়নি” বা “শুধু সুদ গোনা” লেখা থাকে। তালিকার নিচে একটি নোটও আছে। CSV ফাইলে অতিরিক্ত “Counted in totals” কলাম (Yes / No / Interest only) আছে, যাতে নিজেই ফিল্টার করতে পারেন।'],
['What is “Net after loans” in Wallets?','When the Loan tracker is on and you have active loans, the Wallets tab shows a card under the wallet total: wallet total − what you still owe + what you are still owed = net after loans. Wallet balances include money you borrowed and leave out money you lent, so this line shows what you would really have if every loan were settled today. Loans without a wallet are not included, and the card tells you how many were left out.','ওয়ালেট ট্যাবের “লোনের পর নিট ব্যালেন্স” কী?','লোন ট্র্যাকার চালু থাকলে এবং চলমান লোন থাকলে ওয়ালেট ট্যাবে মোটের নিচে একটি কার্ড আসে: ওয়ালেট মোট − এখনো যা দিতে হবে + এখনো যা পাবেন = লোনের পর নিট। ওয়ালেটের ব্যালেন্সে ধার নেওয়া টাকা আছে আর ধার দেওয়া টাকা নেই, তাই এই লাইন দেখায় আজ সব লোন মিটিয়ে দিলে আপনার কাছে আসলে কত থাকত। ওয়ালেট ছাড়া লোন এতে ধরা হয় না, কার্ডে কয়টি বাদ গেছে তাও লেখা থাকে।']
]],
['News','খবর',[
['Where do I find the News?','Go to Settings and tap “Open News” under Loan tracker. It shows Business, Money, Economics, Markets, World, Technology, Science, Sport and All news. Pick a topic chip, or type a word in the search box. Tap “Load more” for older stories.','খবর কোথায় পাব?','সেটিংসে লোন ট্র্যাকারের নিচে “খবর খুলুন” চাপুন। সেখানে ব্যবসা, অর্থ, অর্থনীতি, শেয়ারবাজার, বিশ্ব, প্রযুক্তি, বিজ্ঞান, খেলা ও সব খবর আছে। একটি বিষয় বাছুন, অথবা সার্চ বক্সে শব্দ লিখে খুঁজুন। পুরনো খবরের জন্য “আরও দেখুন” চাপুন।'],
['Where does the news come from, and in which language?','The stories come from The Guardian through its Open Platform, so they are in English. Tapping a story opens the full article on theguardian.com. The news is general information, not financial advice.','খবর কোথা থেকে আসে এবং কোন ভাষায়?','খবর The Guardian এর Open Platform থেকে আসে, তাই ইংরেজিতে। কোনো খবরে চাপলে পুরো লেখা theguardian.com এ খোলে। খবর সাধারণ তথ্য, আর্থিক পরামর্শ নয়।'],
['What data does the News use or share?','The News loads only when you open it. The app asks a news proxy (run by the app owner on Cloudflare Workers) for the topic, search word and page you chose, and the proxy fetches the stories from The Guardian. Your budget data is never sent. See the Privacy Policy section “News” for details and links.','খবর কী তথ্য ব্যবহার বা শেয়ার করে?','খবর খুললে তবেই লোড হয়। অ্যাপ আপনার বাছা বিষয়, খোঁজার শব্দ ও পৃষ্ঠার জন্য একটি নিউজ প্রক্সিকে (অ্যাপের মালিকের Cloudflare Workers এ চালানো) অনুরোধ পাঠায়, প্রক্সি The Guardian থেকে খবর আনে। আপনার বাজেটের ডেটা কখনো পাঠানো হয় না। বিস্তারিত ও লিংক গোপনীয়তা নীতির “খবর” ধারায় আছে।'],
['News does not load. What can I do?','Check that you are online, then tap “Try again” or the ↻ button. If it still fails, the news service may be busy or unavailable for a while; try again later or contact Live support.','খবর লোড হচ্ছে না, কী করব?','ইন্টারনেট চালু আছে কিনা দেখে “আবার চেষ্টা করুন” বা ↻ চাপুন। তবুও না হলে নিউজ সেবা কিছুক্ষণ ব্যস্ত বা বন্ধ থাকতে পারে; পরে আবার চেষ্টা করুন বা লাইভ সাপোর্টে জানান।']
]],
['Notifications','নোটিফিকেশন',[
['What are notifications and where do I see them?','Tap the 🔔 button at the top. A red number shows how many alerts are waiting. Tap an alert to open the related page, or ✕ to dismiss it. When the app opens with new alerts, a short message also appears at the bottom.','নোটিফিকেশন কী এবং কোথায় দেখব?','উপরের 🔔 বাটনে চাপুন। লাল সংখ্যা দেখায় কতগুলো সতর্কতা অপেক্ষায় আছে। সংশ্লিষ্ট পেজ খুলতে সতর্কতায় চাপুন, সরাতে ✕ চাপুন। নতুন সতর্কতা থাকলে অ্যাপ খুললে নিচে একটি ছোট বার্তাও আসে।'],
['Which alerts will I get?','Budget alerts when a category reaches 80% of its budget or goes over; a warning when one category takes over half of this month’s spending or is far above last month; a daily reminder if you have not added any expense by your chosen time; loan alerts for loans due within 3 days, due today or overdue (when Loan tracker is on); and warnings for a wallet below zero or spending above income this month.','কোন কোন সতর্কতা পাব?','কোনো ক্যাটাগরি বাজেটের ৮০% হলে বা ছাড়ালে বাজেট সতর্কতা; একটি ক্যাটাগরি এ মাসের অর্ধেকের বেশি খরচ নিলে বা গত মাসের চেয়ে অনেক বেশি হলে সতর্কতা; আপনার বাছা সময়ের মধ্যে খরচ যোগ না করলে প্রতিদিনের রিমাইন্ডার; ৩ দিনের মধ্যে, আজ বা মেয়াদ পার হওয়া লোনের সতর্কতা (লোন ট্র্যাকার চালু থাকলে); এবং ওয়ালেট শূন্যের নিচে গেলে বা আয়ের চেয়ে বেশি খরচ হলে সতর্কতা।'],
['How do I turn notifications off or choose only some?','Go to Settings, find Notifications and switch it Off to turn everything off (the 🔔 button disappears). Or keep it On and tick or untick each type, and set the time for the daily reminder.','নোটিফিকেশন বন্ধ করব বা কয়েকটি বাছব কীভাবে?','সেটিংসে নোটিফিকেশন অংশে গিয়ে “বন্ধ” করলে সব বন্ধ হয় (🔔 বাটনও চলে যায়)। অথবা “চালু” রেখে প্রতিটি ধরন টিক দিন বা তুলে দিন, আর প্রতিদিনের রিমাইন্ডারের সময় ঠিক করুন।'],
['Will I get alerts when the app is closed? Is my data sent anywhere?','No. Alerts appear only while the app is open, and they are worked out on your device from your own entries. Nothing is sent to anyone. They are helpers, not financial advice, so please check important due dates yourself.','অ্যাপ বন্ধ থাকলেও কি সতর্কতা পাব? ডেটা কি কোথাও যায়?','না। সতর্কতা শুধু অ্যাপ খোলা থাকলে দেখায়, আর আপনার ডিভাইসেই আপনার এন্ট্রি থেকে হিসাব হয়। কিছুই কাউকে পাঠানো হয় না। এগুলো সহায়ক, আর্থিক পরামর্শ নয়; তাই গুরুত্বপূর্ণ তারিখ নিজে মিলিয়ে নিন।']
]],
['About the app','অ্যাপ সম্পর্কে',[
['Who made this app and how?','This app was made by Md. Rakib Hossain. The idea came from the Android app MyMoney, and the first version was built in a few minutes with Claude AI in October 2026. New ideas and features have been added almost every day since, all with free resources. Read the full story in Settings, under “About us”.','এই অ্যাপ কে ও কীভাবে বানিয়েছেন?','অ্যাপটি বানিয়েছেন Md. Rakib Hossain। আইডিয়া এসেছে অ্যান্ড্রয়েড অ্যাপ MyMoney থেকে, আর ২০২৬ সালের অক্টোবর মাসে Claude AI দিয়ে কয়েক মিনিটেই প্রথম সংস্করণ বানানো হয়। তারপর থেকে প্রায় প্রতিদিন নতুন আইডিয়া ও ফিচার যোগ হয়েছে, সবই বিনামূল্যের রিসোর্সে। পুরো গল্প সেটিংসে “আমাদের কথা” অংশে পড়ুন।']
]],
['Recycle bin and settings','রিসাইকেল বিন ও সেটিংস',[
['What is the Recycle bin?','When you delete a record or a loan it is not gone straight away. It moves to the Recycle bin (Settings → Recycle bin) and stays there for 30 days, then it is erased for good. If you delete something by mistake, you can bring it back.','রিসাইকেল বিন কী?','কোনো রেকর্ড বা লোন মুছলে সেটি সাথে সাথে চলে যায় না। সেটি রিসাইকেল বিনে (সেটিংস → রিসাইকেল বিন) যায় এবং ৩০ দিন থাকে, তারপর চিরতরে মুছে যায়। ভুল করে কিছু মুছে ফেললে ফিরিয়ে আনা যায়।'],
['How do I restore or permanently delete an item?','Open Settings → Recycle bin. Tap “Restore” on an item to put it back exactly as it was, or “Delete forever” to erase it now. “Empty recycle bin” erases everything in the bin. Each item shows how many days it has left. If its wallet or category was changed or deleted in the meantime, the app puts it under another one and tells you.','কীভাবে ফিরিয়ে আনব বা চিরতরে মুছব?','সেটিংস → রিসাইকেল বিন খুলুন। কোনো আইটেমে “ফিরিয়ে আনুন” চাপলে ঠিক আগের মতো ফিরে আসে, “চিরতরে মুছুন” চাপলে এখনই মুছে যায়। “রিসাইকেল বিন খালি করুন” চাপলে বিনের সবকিছু মুছে যায়। প্রতিটি আইটেমে কত দিন বাকি তা দেখায়। এর মধ্যে ওয়ালেট বা ক্যাটাগরি বদলে গেলে বা মুছে গেলে অ্যাপ অন্য একটিতে রাখে এবং আপনাকে জানায়।'],
['Does everything I delete go to the Recycle bin?','Records you delete and loans you delete go to the bin. The entries that a loan creates automatically are removed together with the loan, and come back when you restore the loan. Clearing your data or deleting your account does not use the Recycle bin: it erases everything for good, including the bin, and cannot be undone.','আমি যা মুছি সবই কি রিসাইকেল বিনে যায়?','আপনার মোছা রেকর্ড ও লোন বিনে যায়। লোন থেকে নিজে তৈরি হওয়া এন্ট্রি লোনের সাথেই মুছে যায় এবং লোন ফিরিয়ে আনলে ফিরে আসে। তবে ডেটা মোছা বা অ্যাকাউন্ট মোছা রিসাইকেল বিনে যায় না: এটি রিসাইকেল বিনসহ সবকিছু চিরতরে মুছে দেয় এবং আর ফেরানো যায় না।'],
['Why does the clear-data warning mention the Recycle bin?','Because clearing data is different from deleting one record. It erases everything at once, nothing is saved in the Recycle bin, and the bin itself is emptied. Download a PDF or CSV report first if you want a copy.','ডেটা মোছার সতর্কবার্তায় রিসাইকেল বিনের কথা কেন লেখা থাকে?','কারণ ডেটা মোছা আর একটি রেকর্ড মোছা এক নয়। এতে সবকিছু একসাথে মুছে যায়, রিসাইকেল বিনে কিছু জমা হয় না এবং বিনও খালি হয়ে যায়। কপি রাখতে চাইলে আগে PDF বা CSV রিপোর্ট নামিয়ে নিন।'],
['Is the Recycle bin synced and how much space does it use?','Yes. When you are signed in, the bin is stored and synced with your other data, so you can restore on another device. It keeps at most 300 items and drops the oldest ones after that.','রিসাইকেল বিন কি সিঙ্ক হয়?','হ্যাঁ। লগইন করা থাকলে বিন আপনার অন্য ডেটার সাথে সিঙ্ক হয়, তাই অন্য ডিভাইস থেকেও ফিরিয়ে আনা যায়। সর্বোচ্চ ৩০০টি আইটেম থাকে, তার বেশি হলে সবচেয়ে পুরনোগুলো বাদ পড়ে।'],
['How do I hide the AI chat button?','Go to Settings and turn “AI chat button” Off. The button on the Insights tab disappears. It is On by default, and turning it On again brings it back. Your saved Gemini key is not removed; use “Remove key” in the AI chat for that.','AI চ্যাট বাটন কীভাবে লুকাব?','সেটিংসে গিয়ে “AI চ্যাট বাটন” বন্ধ করুন। বিশ্লেষণ ট্যাবের বাটনটি আর দেখাবে না। এটি শুরুতে চালু থাকে, আবার চালু করলে ফিরে আসে। আপনার সেভ করা Gemini key মুছে যায় না; সেটি মুছতে AI চ্যাটের “কি মুছুন” ব্যবহার করুন।']
]],
['Reports and backup','রিপোর্ট ও ব্যাকআপ',[
['How do I get a PDF or CSV report?','Open the Reports tab, choose the From and To dates, then tap Download PDF, Print, Download CSV or Copy CSV. If the PDF does not download, tap Print and choose “Save as PDF”.','PDF বা CSV রিপোর্ট কীভাবে পাব?','রিপোর্ট ট্যাবে শুরু ও শেষ তারিখ বেছে PDF ডাউনলোড, প্রিন্ট, CSV ডাউনলোড বা CSV কপি চাপুন। PDF না নামলে প্রিন্ট চেপে “Save as PDF” বেছে নিন।'],
['How do I back up my data?','Log in with Google so your data syncs to your account, and also export a PDF or CSV now and then. Without login, data lives only in this browser and is lost if browser data is cleared.','ডেটার ব্যাকআপ রাখব কীভাবে?','Google দিয়ে লগইন করুন যাতে ডেটা আপনার অ্যাকাউন্টে সিঙ্ক হয়, আর মাঝে মাঝে PDF বা CSV নামিয়ে রাখুন। লগইন ছাড়া ডেটা শুধু এই ব্রাউজারে থাকে এবং ব্রাউজারের ডেটা মুছলে হারিয়ে যায়।']]],
['Account and sync','অ্যাকাউন্ট ও সিঙ্ক',[
['Do I have to log in?','No. You can use the app without logging in and your data stays on this device. Logging in with Google saves your data to your account and syncs it across your devices.','লগইন করা কি বাধ্যতামূলক?','না। লগইন ছাড়াও ব্যবহার করা যায়, তখন ডেটা এই ডিভাইসেই থাকে। Google দিয়ে লগইন করলে ডেটা আপনার অ্যাকাউন্টে সেভ হয় এবং সব ডিভাইসে সিঙ্ক হয়।'],
['I used the app before logging in. Will my data move?','When you log in to an account that has no cloud data yet, the app asks whether to move the data saved on this device into your account.','লগইনের আগে ব্যবহার করেছি, ডেটা কি সরবে?','ক্লাউডে ডেটা নেই এমন অ্যাকাউন্টে লগইন করলে অ্যাপ জিজ্ঞাসা করে এই ডিভাইসে সেভ থাকা ডেটা আপনার অ্যাকাউন্টে নেবেন কিনা।'],
['Does it work offline?','You can add and view records offline once the app has opened before. Changes are saved on the device and sync automatically when you are back online (the ring around your profile picture turns green when synced). The AI chat needs internet.','অফলাইনে কি চলে?','অ্যাপ আগে একবার খোলা থাকলে অফলাইনেও রেকর্ড যোগ ও দেখা যায়। পরিবর্তন ডিভাইসে সেভ থাকে এবং আবার অনলাইনে এলে নিজে সিঙ্ক হয় (সিঙ্ক হলে প্রোফাইল ছবির বৃত্ত সবুজ হয়)। AI চ্যাটের জন্য ইন্টারনেট লাগে।'],
['How do I change the language, theme or currency?','Open Settings (⚙️): Theme (light or dark), Language (বাংলা or English) and Currency. Currency only changes the symbol; existing amounts are not converted.','ভাষা, থিম বা কারেন্সি বদলাব কীভাবে?','সেটিংস (⚙️) খুলুন: থিম (লাইট বা ডার্ক), ভাষা (বাংলা বা English) এবং কারেন্সি। কারেন্সি শুধু চিহ্ন বদলায়; আগের অঙ্ক রূপান্তর হয় না।'],
['How do I change my name or photo?','After logging in, tap your profile picture and choose Edit profile.','নাম বা ছবি বদলাব কীভাবে?','লগইন করার পর প্রোফাইল ছবিতে চেপে “প্রোফাইল এডিট” বেছে নিন।']]],
['Security and privacy','নিরাপত্তা ও গোপনীয়তা',[
['How does the passcode lock work?','In Settings choose “Set a passcode” (4 to 6 digits). You can add two security questions to reset it later. The lock hides the app on this device and asks again after you have been away for about 30 seconds. It does not encrypt your data.','পাসকোড লক কীভাবে কাজ করে?','সেটিংসে “পাসকোড দিন” বেছে ৪ থেকে ৬ সংখ্যার পাসকোড দিন। পরে রিসেটের জন্য দুটি নিরাপত্তা প্রশ্ন দিতে পারেন। লক এই ডিভাইসে অ্যাপ আড়াল রাখে এবং প্রায় ৩০ সেকেন্ড দূরে থাকার পর আবার চায়। এটি ডেটা এনক্রিপ্ট করে না।'],
['I forgot my passcode.','Tap “Forgot passcode?” on the lock screen. Answer your security questions. If you can’t, a logged-in user can confirm their Google email. Otherwise the data on this device must be erased (without login, that deletes the data).','পাসকোড ভুলে গেছি।','লক স্ক্রিনে “পাসকোড ভুলে গেছেন?” চাপুন। নিরাপত্তা প্রশ্নের উত্তর দিন। না পারলে লগইন করা ব্যবহারকারী Google ইমেইল দিয়ে নিশ্চিত করতে পারেন। নয়তো এই ডিভাইসের ডেটা মুছতে হবে (লগইন ছাড়া হলে ডেটা মুছে যায়)।'],
['How do I clear my data or delete my account?','Settings → Clear data: “This device” erases the copy saved here, and “Cloud data” (when logged in) erases all records, wallets, categories and budgets in your account but keeps your login. To remove everything including your login, tap your profile picture → Delete account (it asks you to sign in with Google once more). Both are permanent.','ডেটা বা অ্যাকাউন্ট মুছব কীভাবে?','সেটিংস → ডেটা মুছুন: “এই ডিভাইস” এখানে সেভ থাকা কপি মোছে, আর “ক্লাউড ডেটা” (লগইন থাকলে) অ্যাকাউন্টের সব রেকর্ড, ওয়ালেট, ক্যাটাগরি ও বাজেট মোছে, লগইন থাকে। লগইনসহ সব মুছতে প্রোফাইল ছবিতে চেপে “অ্যাকাউন্ট মুছুন” বেছে নিন (আরেকবার Google দিয়ে সাইন ইন করতে বলবে)। দুটোই স্থায়ী।'],
['Who can see my data?','Without login, only you, on this device. With login, your data is stored in your account in Google Firebase and only your signed-in account can read it. See the Privacy Policy in Settings for details.','আমার ডেটা কে দেখতে পায়?','লগইন ছাড়া শুধু আপনি, এই ডিভাইসে। লগইন করলে ডেটা Google Firebase এ আপনার অ্যাকাউন্টের অধীনে থাকে এবং শুধু আপনার লগইন করা অ্যাকাউন্টই তা পড়তে পারে। বিস্তারিত সেটিংসের গোপনীয়তা নীতিতে আছে।'],
['Which other services does the app use, and where are their terms?','The app uses Google (sign-in, Firebase database, Fonts and the optional Gemini AI chat), Cloudflare cdnjs (PDF libraries), the PDF libraries html2canvas and jsPDF, and Tally for the Feedback form. Their terms and privacy policies are linked in Settings → Privacy Policy (section 5) and Terms (the “Third-party services” section).','অ্যাপ আর কোন কোন সেবা ব্যবহার করে এবং তাদের শর্ত কোথায়?','অ্যাপ Google (লগইন, Firebase ডেটাবেস, ফন্ট ও ঐচ্ছিক Gemini AI চ্যাট), Cloudflare cdnjs (PDF লাইব্রেরি), PDF লাইব্রেরি html2canvas ও jsPDF এবং মতামত ফর্মের জন্য Tally ব্যবহার করে। তাদের শর্ত ও গোপনীয়তা নীতির লিংক আছে সেটিংস → গোপনীয়তা নীতি (ধারা ৫) এবং শর্তাবলির “তৃতীয় পক্ষের সেবা” ধারায়।']
]],
['Problems and feedback','সমস্যা ও মতামত',[
['I found a bug or have an idea.','Tap Feedback in Settings to open the feedback form, or email the address below. The app’s code was written with Claude AI, so mistakes can happen and your feedback really helps.','বাগ পেয়েছি বা আইডিয়া আছে।','সেটিংসের “মতামত” চেপে ফর্মটি খুলুন, অথবা নিচের ঠিকানায় ইমেইল করুন। অ্যাপের কোড Claude AI দিয়ে লেখা, তাই ভুল থাকতে পারে এবং আপনার মতামত অনেক কাজে লাগে।'],
['How do I chat with live support?','Go to Settings and tap “Live support” under Feedback and help. A chat window opens inside the app and you can write to the app owner. Replies may not be instant; if nobody is online you can leave a message. Use Feedback for suggestions and bug reports, and Live support when you want an answer in a chat.','লাইভ সাপোর্টে কীভাবে চ্যাট করব?','সেটিংসে গিয়ে “মতামত ও সাহায্য” এর নিচে “লাইভ সাপোর্ট” চাপুন। অ্যাপের ভেতরেই চ্যাট খুলবে, সেখানে অ্যাপের মালিককে লিখতে পারবেন। উত্তর সাথে সাথে নাও আসতে পারে; কেউ অনলাইনে না থাকলে মেসেজ রেখে দিন। পরামর্শ ও বাগ জানাতে “মতামত”, আর চ্যাটে উত্তর চাইলে “লাইভ সাপোর্ট” ব্যবহার করুন।'],
['Is live support private? What is shared?','Live support is provided by Tawk.to and loads only when you tap it. What you type, any name or email you give, and technical details such as your IP address, browser and device go to Tawk.to and the app owner. The app does not send your budget data. Please do not share passwords, card numbers or other sensitive details. See the Privacy Policy (section 5) for the links to Tawk.to’s terms and privacy policy.','লাইভ সাপোর্ট কি গোপনীয়? কী তথ্য যায়?','লাইভ সাপোর্ট Tawk.to দেয় এবং আপনি চাপলে তবেই লোড হয়। আপনি যা লেখেন, নিজে থেকে নাম বা ইমেইল দিলে তা, এবং IP অ্যাড্রেস, ব্রাউজার ও ডিভাইসের মতো প্রযুক্তিগত তথ্য Tawk.to ও অ্যাপের মালিকের কাছে যায়। অ্যাপ আপনার বাজেটের ডেটা পাঠায় না। পাসওয়ার্ড, কার্ড নম্বর বা অন্য স্পর্শকাতর তথ্য দেবেন না। Tawk.to এর শর্ত ও গোপনীয়তা নীতির লিংক গোপনীয়তা নীতির ধারা ৫ এ আছে।'],
['Live support does not open. What can I do?','Check that you are online and that no ad blocker or privacy setting is blocking tawk.to, then try again. If it still does not open, use Feedback or send an email to the address in the Help page.','লাইভ সাপোর্ট খুলছে না, কী করব?','ইন্টারনেট চালু আছে কিনা এবং কোনো অ্যাড ব্লকার বা প্রাইভেসি সেটিং tawk.to আটকে দিচ্ছে কিনা দেখে আবার চেষ্টা করুন। তবুও না খুললে “মতামত” ব্যবহার করুন বা সাহায্য পাতার ঠিকানায় ইমেইল করুন।'],
['Where can I find the eBook?','Open Settings and look for “eBook” above Loan tracker. Tap “Open the eBook” and it opens on FlipHTML5 in your browser. The app sends nothing to it; FlipHTML5’s own terms and privacy policy apply (links in the Privacy Policy, section 5, and in the Terms).','ই-বুক কোথায় পাব?','সেটিংস খুলে লোন ট্র্যাকারের উপরে “ই-বুক” দেখুন। “ই-বুক খুলুন” চাপলে FlipHTML5 এ আপনার ব্রাউজারে খুলবে। অ্যাপ সেখানে কিছু পাঠায় না; FlipHTML5 এর নিজস্ব শর্ত ও গোপনীয়তা নীতি প্রযোজ্য (লিংক গোপনীয়তা নীতির ধারা ৫ এ এবং শর্তাবলিতে আছে)।'],
['I do not know how to get a Gemini API key, or I cannot get one. What should I do?','The AI chat window explains it and has a link to Google AI Studio, where a free key can be created. If you are stuck, email the address shown at the top of that window or tap “Live support” there, and we will help you.','Gemini API Key কীভাবে নিতে হয় জানি না বা নিতে পারছি না, কী করব?','AI চ্যাটের উইন্ডোতেই ধাপগুলো লেখা আছে এবং Google AI Studio এর লিংক আছে, যেখানে ফ্রি কি বানানো যায়। আটকে গেলে ওই উইন্ডোর উপরের ঠিকানায় ইমেইল করুন বা সেখানের “লাইভ সাপোর্ট” চাপুন, আমরা সাহায্য করব।'],
['Which wallets come by default, and how do I add more?','New users start with Cash, Bank and Card. Open the Wallets tab and tap the + button at the bottom right to add another (for example Bkash). The same + button on the Categories tab adds a new category. You can rename or delete a wallet that has no records, and your existing wallets are never changed.','শুরুতে কোন কোন ওয়ালেট থাকে, আর কীভাবে আরও যোগ করব?','নতুন ব্যবহারকারীর শুরুতে নগদ, ব্যাংক ও কার্ড থাকে। ওয়ালেট ট্যাবে নিচের ডানের + বাটনে চেপে আরেকটি (যেমন বিকাশ) যোগ করুন। ক্যাটাগরি ট্যাবের একই + বাটনে নতুন ক্যাটাগরি হয়। রেকর্ড নেই এমন ওয়ালেটের নাম বদলানো বা মোছা যায়, আর আপনার আগের ওয়ালেট কখনো বদলায় না।']]]];

o.innerHTML=`<div class="sheet leg faq full"><div class="sh"><h2>❓ ${L('Help','সাহায্য')}</h2><button class="xb" data-a="cl" aria-label="Close">✕</button></div><p style="color:var(--mut)">${L('Answers about every part of the app. Tap a question to open it.','অ্যাপের সব অংশ নিয়ে প্রশ্ন ও উত্তর। প্রশ্নে চাপলে উত্তর খুলবে।')}</p><input id="hq" type="search" class="fqs" autocomplete="off" placeholder="🔍 ${L('Search help','সাহায্যে খুঁজুন')}">`+FAQ.map(s=>`<div class="fsec"><h4>${esc(s[bn?1:0])}</h4>`+s[2].map(x=>`<details><summary>${esc(x[bn?2:0])}</summary><p>${esc(x[bn?3:1])}</p></details>`).join('')+`</div>`).join('')+`<p id="hno" hidden style="text-align:center;color:var(--mut);margin-top:16px">${L('Nothing found. Try another word or send feedback.','কিছু পাওয়া যায়নি। অন্য শব্দে খুঁজুন বা মতামত পাঠান।')}</p><h4>${L('Still need help?','আরও সাহায্য লাগবে?')}</h4><p>${L('Use Feedback in Settings, or email','সেটিংসের মতামত ফর্ম ব্যবহার করুন, অথবা ইমেইল করুন')} <a href="mailto:${CONTACT}">${CONTACT}</a></p></div>`;

async function fetchR(url,opt,n=2,d=1000){try{const r=await fetch(url,opt);if((r.status===429||r.status===503)&&n>0){await new Promise(s=>setTimeout(s,d));return fetchR(url,opt,n-1,d*2)}return r}catch(e){if(n>0&&navigator.onLine){await new Promise(s=>setTimeout(s,d));return fetchR(url,opt,n-1,d*2)}throw e}}
