<style>
:root{--bg:#f4f5fa;--card:#fff;--ink:#1b2233;--mut:#6b7385;--line:#dfe3ec;--exp:#d9435b;--inc:#0f9d7a;--acc:#4338ca;--on:#fff;--sh:rgba(27,34,51,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#11131a;--card:#1a1d27;--ink:#e8eaf2;--mut:#98a0b3;--line:#2c3040;--exp:#ff7b8f;--inc:#4fd1aa;--acc:#8b8cf8;--on:#11131a;--sh:rgba(0,0,0,.5);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,[onclick],[role=button],.tabs *,nav *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button:focus,a:focus,[tabindex]:focus{outline:none}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 'Anek Bangla',system-ui,sans-serif;padding-bottom:150px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
[hidden]{display:none!important}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;box-shadow:0 4px 10px var(--sh)}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;max-width:720px;margin:auto}
.logo{font:italic 800 31px 'Fraunces',Georgia,serif;margin:0;letter-spacing:-1px;color:var(--acc)}
.lb{border:2px solid var(--acc);background:none;color:var(--ink);border-radius:20px;padding:4px 14px;font:inherit;font-weight:700}
#us{padding:2px;width:36px;height:34px;display:grid;place-items:center;border-radius:50%}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;display:block}

const CONTACT='rakibhossain@tuta.io';
const LEG={pp:{en:`<p><small>Last updated: 23 October 2026</small></p><h4>1. What this app is</h4><p>Budget is a personal income and expense tracker, made by Md. Rakib Hossain. The code of this app was written entirely with Claude AI, an AI assistant made by Anthropic.</p><h4>2. What data we handle</h4><p>(a) What you enter: amounts, categories, notes, wallets, budgets, dates and settings (language, theme, currency). (b) If you sign in with Google: your name, email address, profile photo and a unique account ID from Google. We never see your Google password. (c) If you use the optional AI chat: the Gemini API key you paste in and the messages you type there.</p><h4>3. Where it is stored</h4><p>Without login, only in your device’s browser storage. We cannot see it, and clearing browser data deletes it. With login, it is also stored in Google Firebase (Cloud Firestore) under your account so it syncs across devices. Security rules allow only your signed-in account to read or write your data. A custom name or profile photo you set in the app is saved the same way. A passcode and the answers to your security questions, if you set them, are stored only on your device (as one-way hashes) and are never uploaded. Your Gemini API key, if you add one, is also stored only in this browser on your device. It is never uploaded to our cloud or synced to other devices, and it is kept as plain text in browser storage, so use it only on devices you trust. By default it is kept only for the current browser session and disappears when you close the app or sign out; if you tick “Remember on this device” it stays until you remove it. Wallet details, search and the period filter (daily to yearly) run on your device using the data you already have.</p><h4>4. How we use it</h4><p>Only to run the app: show your records, search them on your device, sync, and create reports, PDF and CSV. No ads, no selling or sharing of your data, and no tracking or analytics run by us.</p><p>AI chat (optional): it works only if you add your own Gemini API key. When you send a message there, or tap a ready-made prompt, the app sends your message, the conversation so far and a summary of your data for the period you choose in the AI chat (Daily, Weekly, Monthly, 3 months, 6 months or Yearly): totals, category amounts, a comparison with the previous period, monthly totals of the last 6 months, budgets, wallet names and balances, and up to your 500 most recent records in that period including their notes) directly from your device to Google’s Gemini API using your key. We do not receive or store these messages, and nothing is sent until you send a message. The chat history is kept only in memory and disappears when you reload the app, tap the clear button or close the page.</p><h4>5. Third parties</h4><p>Google (sign-in and database via Firebase), Google Gemini API (only if you use the AI chat; Google’s own terms and privacy policy apply to what you send), Google Fonts (fonts), Cloudflare cdnjs (PDF libraries) and the hosting service may log standard visit information such as IP address. Their own policies apply. Tally (tally.so) is used only if you tap Feedback in Settings: the form opens in your browser, what you type there goes to Tally and the app owner under Tally’s own terms and privacy policy, and the app does not send your budget data to it. The Help page is built into the app and collects nothing.</p><h4>6. Reports and files</h4><p>PDF, CSV and print files are created on your device and are not uploaded anywhere.</p><h4>7. Your choices and deleting your account</h4><p>You can use the app without logging in, sign out at any time and delete records inside the app. You can remove your Gemini API key at any time with the key button in the AI chat. When you sign out, the app asks whether to remove a key you saved on this device; if you choose to keep it, it stays, while Clear data on this device, resetting a forgotten passcode by erasing data, and deleting your account always remove it. In Settings, Clear data lets you erase the copy saved on this device or, when logged in, erase all your records, wallets, categories and budgets in the cloud while keeping your account. If you forget your passcode, you can reset it with your security questions; without them, a logged-in user can confirm the account email, and otherwise the data on this device must be cleared (without login, this erases the data). You can delete your account yourself: tap your profile picture, then Delete account. After a warning and one more Google sign-in to confirm, this permanently deletes:</p><ul><li>your cloud data (records, wallets, categories, budgets, settings),</li><li>the copy of that data on the device, and</li><li>your sign-in with this app.</li></ul><p>Your Google account itself is not deleted. Deletion cannot be undone, and Google’s systems may take a short time to fully remove deleted data. You can also email <a href="mailto:${CONTACT}">${CONTACT}</a> for help.</p><h4>8. Security</h4><p>Data travels over HTTPS and is protected by account-based rules, but no system is 100% secure. Keep your Google account safe and sign out on shared devices.</p><h4>9. Children</h4><p>This app is not meant for children under 13.</p><h4>10. Changes</h4><p>If this policy changes, the new version and date will appear here.</p><h4>11. Contact</h4><p><a href="mailto:${CONTACT}">${CONTACT}</a></p>`,
bn:`<p><small>শেষ হালনাগাদ: ২৩ অক্টোবর ২০২৬</small></p><h4>১. এই অ্যাপ কী</h4><p>Budget হলো ব্যক্তিগত আয়-ব্যয়ের হিসাব রাখার অ্যাপ, তৈরি করেছেন Md. Rakib Hossain। এই অ্যাপের কোড সম্পূর্ণ Claude AI (Anthropic এর তৈরি একটি AI সহকারী) দিয়ে লেখা।</p><h4>২. আমরা কোন তথ্য নিই</h4><p>(ক) আপনার দেওয়া হিসাব: টাকার অঙ্ক, ক্যাটাগরি, নোট, ওয়ালেট, বাজেট, তারিখ এবং সেটিংস (ভাষা, থিম, কারেন্সি)। (খ) Google দিয়ে লগইন করলে: আপনার নাম, ইমেইল, প্রোফাইল ছবি ও Google এর দেওয়া একটি ইউনিক আইডি। আপনার Google পাসওয়ার্ড আমরা কখনো দেখি না। (গ) ঐচ্ছিক AI চ্যাট ব্যবহার করলে: আপনার পেস্ট করা Gemini API Key এবং সেখানে লেখা মেসেজ।</p><h4>৩. তথ্য কোথায় থাকে</h4><p>লগইন ছাড়া শুধু আপনার ডিভাইসের ব্রাউজারে থাকে। আমরা তা দেখতে পাই না, আর ব্রাউজারের ডেটা মুছলে তা চলে যাবে। লগইন করলে Google Firebase (Cloud Firestore) এ আপনার অ্যাকাউন্টের অধীনে সেভ হয়, যাতে সব ডিভাইসে সিঙ্ক থাকে। নিরাপত্তা নিয়মে শুধু আপনার লগইন করা অ্যাকাউন্টই আপনার তথ্য পড়তে ও লিখতে পারে। অ্যাপে আপনার দেওয়া নাম বা প্রোফাইল ছবিও একইভাবে সেভ হয়। পাসকোড এবং নিরাপত্তা প্রশ্নের উত্তর দিলে তা শুধু আপনার ডিভাইসে (একমুখী হ্যাশ হিসেবে) থাকে, কখনো আপলোড হয় না। আপনি Gemini API Key দিলে সেটিও শুধু এই ডিভাইসের ব্রাউজারে থাকে। এটি আমাদের ক্লাউডে আপলোড বা অন্য ডিভাইসে সিঙ্ক হয় না, আর ব্রাউজার স্টোরেজে সাধারণ টেক্সট হিসেবে থাকে, তাই শুধু বিশ্বস্ত ডিভাইসে ব্যবহার করুন। ডিফল্টভাবে এটি শুধু বর্তমান ব্রাউজার সেশনে থাকে এবং অ্যাপ বন্ধ করলে বা লগআউট করলে চলে যায়; “এই ডিভাইসে মনে রাখো” টিক দিলে আপনি না মোছা পর্যন্ত থাকে। ওয়ালেটের বিবরণ, খোঁজা এবং সময়কাল ফিল্টার (দৈনিক থেকে বাৎসরিক) আপনার ডিভাইসেই, আপনার আগের ডেটা দিয়ে চলে।</p><h4>৪. কীভাবে ব্যবহার হয়</h4><p>শুধু অ্যাপ চালাতে: রেকর্ড দেখানো, আপনার ডিভাইসে খোঁজা, সিঙ্ক করা, রিপোর্ট/PDF/CSV বানানো। আমরা বিজ্ঞাপন দেখাই না, আপনার তথ্য বিক্রি বা শেয়ার করি না, আর নিজেরা কোনো ট্র্যাকিং বা অ্যানালিটিক্স চালাই না।</p><p>AI চ্যাট (ঐচ্ছিক): নিজের Gemini API Key দিলে তবেই চলে। সেখানে মেসেজ পাঠালে বা তৈরি প্রম্পটে চাপলে অ্যাপ আপনার মেসেজ, আগের কথোপকথন এবং AI চ্যাটে আপনার বেছে নেওয়া সময়ের (দৈনিক, সাপ্তাহিক, মাসিক, ৩ মাস, ৬ মাস বা বার্ষিক) ডেটার সারাংশ (মোট অঙ্ক, ক্যাটাগরি অনুযায়ী অঙ্ক, আগের সময়ের সাথে তুলনা, গত ৬ মাসের মাসওয়ারি মোট, বাজেট, ওয়ালেটের নাম ও ব্যালেন্স এবং ওই সময়ের নোটসহ সাম্প্রতিক সর্বোচ্চ ৫০০টি রেকর্ড) আপনার ডিভাইস থেকে আপনার কি দিয়ে সরাসরি Google এর Gemini API তে পাঠায়। এই মেসেজ আমরা পাই না বা সংরক্ষণ করি না, আর আপনি মেসেজ না পাঠালে কিছুই পাঠানো হয় না। চ্যাটের ইতিহাস শুধু মেমরিতে থাকে; অ্যাপ রিলোড করলে, মুছুন বাটন চাপলে বা পেজ বন্ধ করলে চলে যায়।</p><h4>৫. তৃতীয় পক্ষ</h4><p>Google (Firebase এর মাধ্যমে লগইন ও ডেটাবেস), Google Gemini API (শুধু AI চ্যাট ব্যবহার করলে; আপনার পাঠানো তথ্যে Google এর নিজস্ব শর্ত ও গোপনীয়তা নীতি প্রযোজ্য), Google Fonts (ফন্ট), Cloudflare cdnjs (PDF লাইব্রেরি) এবং হোস্টিং সেবা সাধারণ ভিজিটের তথ্য (যেমন IP অ্যাড্রেস) লগ করতে পারে। তাদের নিজ নিজ নীতি প্রযোজ্য। সেটিংসে “মতামত” চাপলে তবেই Tally (tally.so) ব্যবহার হয়: ফর্মটি আপনার ব্রাউজারে খোলে, সেখানে আপনি যা লেখেন তা Tally এর নিজস্ব শর্ত ও গোপনীয়তা নীতি অনুযায়ী Tally ও অ্যাপের মালিকের কাছে যায়, আর অ্যাপ আপনার বাজেটের ডেটা সেখানে পাঠায় না। সাহায্য পাতাটি অ্যাপের ভেতরেই থাকে এবং কিছু সংগ্রহ করে না।</p><h4>৬. রিপোর্ট ও ফাইল</h4><p>PDF, CSV ও প্রিন্ট আপনার ডিভাইসেই তৈরি হয়, কোথাও আপলোড হয় না।</p><h4>৭. আপনার নিয়ন্ত্রণ ও অ্যাকাউন্ট মোছা</h4><p>লগইন ছাড়াই অ্যাপ ব্যবহার করা যায়। যেকোনো সময় সাইন আউট করা যায় এবং অ্যাপ থেকে রেকর্ড মুছে ফেলা যায়। AI চ্যাটের চাবি (🔑) বাটন দিয়ে যেকোনো সময় Gemini API Key মুছতে পারেন। লগআউটের সময় অ্যাপ জিজ্ঞাসা করে এই ডিভাইসে সেভ করা key মুছবেন কিনা; রাখতে চাইলে তা থেকে যায়; তবে এই ডিভাইসের ডেটা মুছলে, ডেটা মুছে পাসকোড রিসেট করলে এবং অ্যাকাউন্ট মুছলে তা সবসময় মুছে যায়। সেটিংসের “ডেটা মুছুন” থেকে এই ডিভাইসে সেভ থাকা কপি, অথবা লগইন করা থাকলে ক্লাউডের সব রেকর্ড, ওয়ালেট, ক্যাটাগরি ও বাজেট (অ্যাকাউন্ট রেখে) মুছে ফেলা যায়। পাসকোড ভুলে গেলে নিরাপত্তা প্রশ্ন দিয়ে রিসেট করা যায়; প্রশ্ন না থাকলে লগইন করা ব্যবহারকারী অ্যাকাউন্টের ইমেইল লিখে নিশ্চিত করতে পারেন, নয়তো এই ডিভাইসের ডেটা মুছতে হবে (লগইন ছাড়া হলে ডেটা মুছে যায়)। আপনি নিজেই অ্যাকাউন্ট মুছতে পারেন: প্রোফাইল ছবিতে চাপ দিয়ে “অ্যাকাউন্ট মুছুন” বেছে নিন। সতর্কবার্তা দেখে এবং নিশ্চিত করতে আবার Google দিয়ে সাইন ইন করলে নিচের জিনিসগুলো স্থায়ীভাবে মুছে যায়:</p><ul><li>ক্লাউডে থাকা আপনার তথ্য (রেকর্ড, ওয়ালেট, ক্যাটাগরি, বাজেট, সেটিংস),</li><li>ওই ডিভাইসে থাকা তথ্যের কপি, এবং</li><li>এই অ্যাপে আপনার লগইন।</li></ul><p>আপনার Google অ্যাকাউন্ট নিজে মুছে যায় না। মোছা কাজ আর ফেরানো যায় না, আর Google এর সিস্টেম থেকে মুছে যাওয়া তথ্য পুরোপুরি সরতে কিছু সময় লাগতে পারে। সাহায্যের জন্য <a href="mailto:${CONTACT}">${CONTACT}</a> এ ইমেইলও করতে পারেন।</p><h4>৮. নিরাপত্তা</h4><p>তথ্য HTTPS দিয়ে যায় এবং অ্যাকাউন্টভিত্তিক নিয়মে সুরক্ষিত। তবে কোনো সিস্টেমই ১০০% নিরাপদ নয়। আপনার Google অ্যাকাউন্ট নিরাপদ রাখুন, আর শেয়ার করা ডিভাইসে ব্যবহার শেষে সাইন আউট করুন।</p><h4>৯. শিশু</h4><p>এই অ্যাপ ১৩ বছরের কম বয়সীদের জন্য নয়।</p><h4>১০. পরিবর্তন</h4><p>নীতি বদলালে নতুন সংস্করণ ও তারিখ এখানে দেখানো হবে।</p><h4>১১. যোগাযোগ</h4><p><a href="mailto:${CONTACT}">${CONTACT}</a></p>`},
tc:{en:`<p><small>Last updated: 23 October 2026</small></p><h4>1. Acceptance</h4><p>By using Budget you agree to these terms. If you do not agree, please do not use the app.</p><h4>2. The service</h4><p>Budget is a free personal money tracker made by Md. Rakib Hossain, provided “as is”. The code of this app was written entirely with Claude AI, so it may contain mistakes or bugs. You can report them with Feedback in Settings.</p><h4>3. Not professional advice</h4><p>Budget is not financial, tax, accounting or legal advice. Totals and reports depend on what you enter, so please check them yourself. The Help page gives general guidance and may not cover every case.</p><h4>4. Your data and account</h4><p>Your data belongs to you. You are responsible for entering it correctly, keeping your device and Google account secure, and keeping your own backup (for example a PDF or CSV export). You can clear your data from Settings or delete your account from the profile menu at any time. Clearing and deletion are permanent and cannot be undone.</p><h4>5. Acceptable use</h4><p>Do not misuse the app: no unauthorised access, no disrupting the service, no bypassing its security, and no unlawful use.</p><h4>6. AI chat (optional)</h4><p>The AI chat is optional and works only with your own Gemini API key, which you get from Google AI Studio. You are responsible for your key, for keeping it private, and for any usage limits or charges under your Google account. When you use the chat, your message and a summary of your budget data are sent to Google’s Gemini API, and Google’s own terms apply to that. Do not type passwords, card numbers or other sensitive details. AI answers can be wrong, incomplete or out of date. They are general information based on what you recorded, not financial, tax, accounting or legal advice, so please check them before acting. The chat needs an internet connection and may stop working if Google changes or limits its service.</p><h4>7. Currency</h4><p>The currency setting only changes the symbol. Existing amounts are not converted.</p><h4>8. Availability</h4><p>We may change, pause or stop the app at any time. Data can be lost, for example when browser data is cleared, sync fails, an account is deleted or a forgotten passcode forces data to be erased. The passcode is a privacy lock, not strong security.</p><h4>9. Limitation of liability</h4><p>To the maximum extent allowed by law, the app owner is not liable for indirect or incidental loss, or for loss of data, arising from your use of the app.</p><h4>10. Ending use</h4><p>You can stop using the app at any time or delete your account. We may restrict access if the app is misused.</p><h4>11. Changes</h4><p>We may update these terms. Continued use means you accept the new version.</p><h4>12. Contact</h4><p><a href="mailto:${CONTACT}">${CONTACT}</a></p>`,
bn:`<p><small>শেষ হালনাগাদ: ২৩ অক্টোবর ২০২৬</small></p><h4>১. সম্মতি</h4><p>Budget ব্যবহার করলে আপনি এই শর্তগুলোতে সম্মত হচ্ছেন। সম্মত না হলে অ্যাপটি ব্যবহার করবেন না।</p><h4>২. সেবা</h4><p>Budget Md. Rakib Hossain এর তৈরি একটি বিনামূল্যের ব্যক্তিগত আয়-ব্যয়ের অ্যাপ, যেমন আছে তেমনভাবে (“as is”) দেওয়া হয়। অ্যাপের কোড সম্পূর্ণ Claude AI দিয়ে লেখা, তাই ভুল বা বাগ থাকতে পারে। সেটিংসের “মতামত” দিয়ে জানাতে পারেন।</p><h4>৩. পেশাদার পরামর্শ নয়</h4><p>Budget আর্থিক, কর, হিসাবরক্ষণ বা আইনি পরামর্শ নয়। মোট অঙ্ক ও রিপোর্ট আপনার দেওয়া তথ্যের ওপর নির্ভর করে, তাই নিজে যাচাই করে নিন। সাহায্য পাতা সাধারণ নির্দেশনা দেয়, সব ক্ষেত্র নাও ঢাকতে পারে।</p><h4>৪. আপনার তথ্য ও অ্যাকাউন্ট</h4><p>আপনার তথ্য আপনারই। সঠিকভাবে তথ্য দেওয়া, ডিভাইস ও Google অ্যাকাউন্ট নিরাপদ রাখা এবং নিজের ব্যাকআপ (যেমন PDF বা CSV) রাখার দায়িত্ব আপনার। সেটিংস থেকে ডেটা মুছতে বা প্রোফাইল মেনু থেকে যেকোনো সময় অ্যাকাউন্ট মুছতে পারেন। ডেটা মোছা ও অ্যাকাউন্ট মোছা স্থায়ী, আর ফেরানো যায় না।</p><h4>৫. গ্রহণযোগ্য ব্যবহার</h4><p>অ্যাপের অপব্যবহার করবেন না: অনুমতি ছাড়া প্রবেশ, সেবা বিঘ্নিত করা, নিরাপত্তা এড়িয়ে যাওয়া বা বেআইনি কাজে ব্যবহার করা যাবে না।</p><h4>৬. AI চ্যাট (ঐচ্ছিক)</h4><p>AI চ্যাট ঐচ্ছিক এবং শুধু আপনার নিজের Gemini API Key দিয়ে চলে, যা আপনি Google AI Studio থেকে নেন। কি নিরাপদ রাখা এবং আপনার Google অ্যাকাউন্টের ব্যবহারসীমা বা খরচের দায়িত্ব আপনার। চ্যাট ব্যবহার করলে আপনার মেসেজ ও বাজেট ডেটার সারাংশ Google এর Gemini API তে যায়, এবং তাতে Google এর নিজস্ব শর্ত প্রযোজ্য। পাসওয়ার্ড, কার্ড নম্বর বা অন্য স্পর্শকাতর তথ্য লিখবেন না। AI এর উত্তর ভুল, অসম্পূর্ণ বা পুরোনো হতে পারে। এগুলো আপনার লেখা তথ্যের ভিত্তিতে সাধারণ তথ্য মাত্র, আর্থিক, কর, হিসাবরক্ষণ বা আইনি পরামর্শ নয়, তাই কাজ করার আগে যাচাই করে নিন। চ্যাটের জন্য ইন্টারনেট লাগে এবং Google তাদের সেবা বদলালে বা সীমিত করলে এটি বন্ধ হয়ে যেতে পারে।</p><h4>৭. কারেন্সি</h4><p>কারেন্সি সেটিং শুধু চিহ্ন বদলায়। আগের অঙ্ক রূপান্তর হয় না।</p><h4>৮. সেবার প্রাপ্যতা</h4><p>আমরা যেকোনো সময় অ্যাপ বদলাতে, সাময়িক বা স্থায়ীভাবে বন্ধ করতে পারি। ব্রাউজারের ডেটা মুছলে, সিঙ্ক ব্যর্থ হলে, অ্যাকাউন্ট মুছলে বা পাসকোড ভুলে ডেটা মুছতে হলে তথ্য হারিয়ে যেতে পারে। পাসকোড একটি গোপনীয়তার লক, শক্তিশালী নিরাপত্তা নয়।</p><h4>৯. দায়ের সীমা</h4><p>আইনে যতটুকু অনুমোদিত, অ্যাপ ব্যবহারের ফলে হওয়া পরোক্ষ ক্ষতি বা তথ্য হারানোর দায় অ্যাপের মালিকের নয়।</p><h4>১০. ব্যবহার বন্ধ</h4><p>আপনি যেকোনো সময় ব্যবহার বন্ধ করতে বা অ্যাকাউন্ট মুছতে পারেন। অপব্যবহার হলে আমরা প্রবেশ সীমিত করতে পারি।</p><h4>১১. পরিবর্তন</h4><p>আমরা শর্ত হালনাগাদ করতে পারি। ব্যবহার চালিয়ে গেলে নতুন সংস্করণে সম্মতি ধরা হবে।</p><h4>১২. যোগাযোগ</h4><p><a href="mailto:${CONTACT}">${CONTACT}</a></p>`}};
function legal(k){const o=$('#m'),bn=S.lang==='bn';o.hidden=false;o.innerHTML=`<div class="sheet leg full"><div class="sh"><h2>${k==='pp'?(bn?'গোপনীয়তা নীতি':'Privacy Policy'):(bn?'ব্যবহারের শর্তাবলি':'Terms & Conditions')}</h2><button class="xb" data-a="cl" aria-label="Close">✕</button></div>${LEG[k][bn?'bn':'en']}</div>`}
const FAQ=[
['Getting started','শুরু করা',[
['How do I add an expense, income or transfer?','Tap the + button on the Entries tab, choose Expense, Income or Transfer, pick the wallet and category, type the amount and tap Save.','খরচ, আয় বা ট্রান্সফার কীভাবে যোগ করব?','লেনদেন ট্যাবে + চাপুন, খরচ, আয় বা ট্রান্সফার বেছে নিন, ওয়ালেট ও ক্যাটাগরি ঠিক করুন, পরিমাণ লিখে সেভ চাপুন।'],
['Can I create a new category or wallet while adding a record?','Yes. Tap the Account or Category button, then tap “Add new wallet” or “Add new category” at the bottom of the list. Give it a name and icon, save, and it is selected for your record right away.','রেকর্ড যোগ করার সময়ই নতুন ক্যাটাগরি বা ওয়ালেট বানানো যায়?','হ্যাঁ। অ্যাকাউন্ট বা ক্যাটাগরি বাটনে চেপে তালিকার নিচে “নতুন ওয়ালেট যোগ করুন” বা “নতুন ক্যাটাগরি যোগ করুন” চাপুন। নাম ও আইকন দিয়ে সেভ করলে সেটিই আপনার রেকর্ডে বাছা হয়ে যায়।'],
['Can I type a calculation as the amount?','Yes. Type something like 50+20 or 120*3 in the amount box (the + − × ÷ buttons help). Bengali digits work too.','পরিমাণের ঘরে হিসাব লিখতে পারি?','হ্যাঁ। পরিমাণের ঘরে 50+20 বা 120*3 লিখতে পারেন (+ − × ÷ বাটনও আছে)। বাংলা সংখ্যাও চলে।'],
['How do I edit, duplicate or delete a record?','Tap the record to open it. The top bar has ✎ to edit, ⧉ to duplicate and 🗑️ to delete.','রেকর্ড এডিট, কপি বা মুছব কীভাবে?','রেকর্ডে চাপলে খুলবে। উপরের বারে ✎ এডিট, ⧉ কপি এবং 🗑️ মুছুন আইকন আছে।'],
['How do I move to another month or switch to weekly or yearly view?','Use the ‹ › arrows at the top to move between periods. Tap the filter icon (≡) next to the search bar to choose Daily, Weekly, Monthly, 3 Months, 6 Months or Yearly.','অন্য মাসে বা সাপ্তাহিক/বাৎসরিক ভিউতে যাব কীভাবে?','উপরের ‹ › তীর দিয়ে সময় বদলান। সার্চ বারের পাশের ফিল্টার আইকনে (≡) চেপে দৈনিক, সাপ্তাহিক, মাসিক, ৩ মাস, ৬ মাস বা বাৎসরিক বেছে নিন।'],
['How do I search my records?','On the Entries tab, type in the search box. It looks through notes, categories, wallets, amounts and the words expense, income and transfer, across all dates.','রেকর্ড খুঁজব কীভাবে?','লেনদেন ট্যাবের সার্চ বক্সে লিখুন। নোট, ক্যাটাগরি, ওয়ালেট, অঙ্ক এবং খরচ/আয়/ট্রান্সফার শব্দ ধরে সব তারিখের রেকর্ডে খোঁজে।'],
['Why can’t I transfer to the same wallet?','A transfer moves money between two different wallets, so From and To must be different. If you only have one wallet, add another first.','একই ওয়ালেটে ট্রান্সফার করা যায় না কেন?','ট্রান্সফার মানে দুটো আলাদা ওয়ালেটের মধ্যে টাকা সরানো, তাই “থেকে” ও “তে” আলাদা হতে হবে। একটাই ওয়ালেট থাকলে আগে আরেকটি যোগ করুন।']]],
['Insights and AI chat','বিশ্লেষণ ও AI চ্যাট',[
['What do the Insights show?','Pick a view from the drop-down: Expense or Income overview (donut chart by category, plus a trend chart and table of recent periods), Expense or Income flow (daily line chart and calendar) and Account analysis (income and expense per wallet). Use the filter icon to change the period.','বিশ্লেষণ ট্যাবে কী দেখা যায়?','ড্রপডাউন থেকে বেছে নিন: খরচ বা আয়ের সারসংক্ষেপ (ক্যাটাগরি অনুযায়ী ডোনাট চার্ট এবং সাম্প্রতিক সময়ের ট্রেন্ড চার্ট ও টেবিল), খরচ বা আয়ের প্রবাহ (দৈনিক লাইন চার্ট ও ক্যালেন্ডার) এবং অ্যাকাউন্ট বিশ্লেষণ (ওয়ালেট অনুযায়ী আয়-খরচ)। সময়কাল বদলাতে ফিল্টার আইকন ব্যবহার করুন।'],
['What is the AI chat and how do I set it up?','On the Insights tab tap the ✨ button. It is red until you add your own free Gemini API key (get one from Google AI Studio) and turns green once a key is saved. Then pick a ready-made prompt or ask your own question about your income, spending, budgets and wallets.','AI চ্যাট কী এবং কীভাবে চালু করব?','বিশ্লেষণ ট্যাবের ✨ বাটনে চাপুন। নিজের ফ্রি Gemini API Key (Google AI Studio থেকে) না দেওয়া পর্যন্ত এটি লাল থাকে, key সেভ হলে সবুজ হয়। এরপর তৈরি প্রম্পট বেছে নিন বা আপনার আয়, খরচ, বাজেট ও ওয়ালেট নিয়ে নিজের প্রশ্ন লিখুন।'],
['How do I choose the period for AI analysis?','Open the AI chat and tap Daily, Weekly, Monthly, 3 months, 6 months or Yearly under the title. Monthly is recommended: longer periods send much more data and may hit the free Gemini limit or fail. Ready-made prompts like Next month, vs last period, 3-month plan, Goal plan and Weekly plan use your data to forecast and plan.','AI বিশ্লেষণের সময়কাল কীভাবে বাছব?','AI চ্যাট খুলে শিরোনামের নিচে দৈনিক, সাপ্তাহিক, মাসিক, ৩ মাস, ৬ মাস বা বার্ষিক চাপুন। মাসিক ব্যবহার করার পরামর্শ: লম্বা সময়ে অনেক বেশি ডেটা যায়, তাই ফ্রি Gemini সীমা শেষ হতে বা এরর আসতে পারে। আগামী মাস, আগের সময়ের সাথে, ৩ মাসের পরিকল্পনা, লক্ষ্য ও সাপ্তাহিক পরিকল্পনার মতো তৈরি প্রম্পট আপনার ডেটা দিয়ে পূর্বাভাস ও পরিকল্পনা বানায়।'],
['What does the AI see, and is my key safe?','Only when you send a message, a summary of the period you picked in the chat (totals, categories, previous-period comparison, last 6 months, budgets, wallets and up to 500 recent records with notes) goes from your device straight to Google Gemini using your key. The key stays in your browser only. By default it is forgotten when you close the app; tick “Remember on this device” to keep it. You can remove it anytime with the 🔑 button in the chat.','AI কী কী দেখতে পায়, আর আমার key কি নিরাপদ?','আপনি মেসেজ পাঠালে তবেই চ্যাটে বেছে নেওয়া সময়ের সারাংশ (মোট অঙ্ক, ক্যাটাগরি, আগের সময়ের তুলনা, গত ৬ মাস, বাজেট, ওয়ালেট ও নোটসহ সাম্প্রতিক সর্বোচ্চ ৫০০টি রেকর্ড) আপনার ডিভাইস থেকে আপনার key দিয়ে সরাসরি Google Gemini তে যায়। key শুধু আপনার ব্রাউজারে থাকে। ডিফল্টভাবে অ্যাপ বন্ধ করলে মুছে যায়; রাখতে চাইলে “এই ডিভাইসে মনে রাখো” টিক দিন। চ্যাটের 🔑 বাটন দিয়ে যেকোনো সময় মুছতে পারেন।'],
['Why does the AI button do nothing, or show an error?','The AI chat needs internet. When you are offline the button is dimmed and does nothing. If you see an API key error, tap 🔑 in the chat and paste a valid key.','AI বাটনে চাপলে কিছু হয় না বা ত্রুটি আসে কেন?','AI চ্যাটের জন্য ইন্টারনেট লাগে। অফলাইনে বাটন ঝাপসা থাকে ও কিছু হয় না। API key এর ত্রুটি এলে চ্যাটের 🔑 চেপে সঠিক key দিন।']]],
['Budgets, wallets and categories','বাজেট, ওয়ালেট ও ক্যাটাগরি',[
['How do I set a budget?','Open the Budgets tab, tap a category and enter the monthly amount. The bar shows how much you have spent this month and how much is left or over. Leave it blank or enter 0 to remove it.','বাজেট ঠিক করব কীভাবে?','বাজেট ট্যাবে ক্যাটাগরিতে চেপে মাসিক পরিমাণ দিন। বার দেখায় এই মাসে কত খরচ হয়েছে, কত বাকি বা বেশি। খালি রাখলে বা ০ দিলে বাজেট বন্ধ হয়।'],
['How do wallets work?','Wallets (cash, bank, mobile banking and so on) hold your balance. Add one with + on the Wallets tab, set an opening balance, and tap a wallet to see its records. Balance = opening balance + income − expense, adjusted by transfers.','ওয়ালেট কীভাবে কাজ করে?','ওয়ালেটে (নগদ, ব্যাংক, মোবাইল ব্যাংকিং ইত্যাদি) আপনার ব্যালেন্স থাকে। ওয়ালেট ট্যাবে + চেপে যোগ করুন, শুরুর ব্যালেন্স দিন, আর ওয়ালেটে চাপলে তার রেকর্ড দেখা যায়। ব্যালেন্স = শুরুর ব্যালেন্স + আয় − খরচ, ট্রান্সফার মিলিয়ে।'],
['Why can’t I delete a wallet or category?','A wallet or category that already has records can’t be deleted, and your last wallet can’t be deleted. Edit or delete those records first, or just rename it.','ওয়ালেট বা ক্যাটাগরি মুছতে পারছি না কেন?','যে ওয়ালেট বা ক্যাটাগরিতে রেকর্ড আছে তা মোছা যায় না, আর শেষ ওয়ালেটও মোছা যায় না। আগে ওই রেকর্ডগুলো বদলান বা মুছুন, অথবা শুধু নাম বদলে নিন।'],
['Can I make my own categories?','Yes. On the Categories tab tap +, choose Expense or Income, then pick a name, emoji and color.','নিজের ক্যাটাগরি বানানো যায়?','হ্যাঁ। ক্যাটাগরি ট্যাবে + চেপে খরচ বা আয় বেছে নাম, ইমোজি ও রং দিন।']]],
['Reports and backup','রিপোর্ট ও ব্যাকআপ',[
['How do I get a PDF or CSV report?','Open the Reports tab, choose the From and To dates, then tap Download PDF, Print, Download CSV or Copy CSV. If the PDF does not download, tap Print and choose “Save as PDF”.','PDF বা CSV রিপোর্ট কীভাবে পাব?','রিপোর্ট ট্যাবে শুরু ও শেষ তারিখ বেছে PDF ডাউনলোড, প্রিন্ট, CSV ডাউনলোড বা CSV কপি চাপুন। PDF না নামলে প্রিন্ট চেপে “Save as PDF” বেছে নিন।'],
['How do I back up my data?','Log in with Google so your data syncs to your account, and also export a PDF or CSV now and then. Without login, data lives only in this browser and is lost if browser data is cleared.','ডেটার ব্যাকআপ রাখব কীভাবে?','Google দিয়ে লগইন করুন যাতে ডেটা আপনার অ্যাকাউন্টে সিঙ্ক হয়, আর মাঝে মাঝে PDF বা CSV নামিয়ে রাখুন। লগইন ছাড়া ডেটা শুধু এই ব্রাউজারে থাকে এবং ব্রাউজারের ডেটা মুছলে হারিয়ে যায়।']]],
['Account and sync','অ্যাকাউন্ট ও সিঙ্ক',[
['Do I have to log in?','No. You can use the app without logging in and your data stays on this device. Logging in with Google saves your data to your account and syncs it across your devices.','লগইন করা কি বাধ্যতামূলক?','না। লগইন ছাড়াও ব্যবহার করা যায়, তখন ডেটা এই ডিভাইসেই থাকে। Google দিয়ে লগইন করলে ডেটা আপনার অ্যাকাউন্টে সেভ হয় এবং সব ডিভাইসে সিঙ্ক হয়।'],
['I used the app before logging in. Will my data move?','When you log in to an account that has no cloud data yet, the app asks whether to move the data saved on this device into your account.','লগইনের আগে ব্যবহার করেছি, ডেটা কি সরবে?','ক্লাউডে ডেটা নেই এমন অ্যাকাউন্টে লগইন করলে অ্যাপ জিজ্ঞাসা করে এই ডিভাইসে সেভ থাকা ডেটা আপনার অ্যাকাউন্টে নেবেন কিনা।'],
['Does it work offline?','You can add and view records offline once the app has opened before. Changes are saved on the device and sync automatically when you are back online (the ring around your profile picture turns green when synced). The AI chat needs internet.','অফলাইনে কি চলে?','অ্যাপ আগে একবার খোলা থাকলে অফলাইনেও রেকর্ড যোগ ও দেখা যায়। পরিবর্তন ডিভাইসে সেভ থাকে এবং আবার অনলাইনে এলে নিজে সিঙ্ক হয় (সিঙ্ক হলে প্রোফাইল ছবির বৃত্ত সবুজ হয়)। AI চ্যাটের জন্য ইন্টারনেট লাগে।'],
['How do I change the language, theme or currency?','Open Settings (⚙️): Theme (light or dark), Language (বাংলা or English) and Currency. Currency only changes the symbol; existing amounts are not converted.','ভাষা, থিম বা কারেন্সি বদলাব কীভাবে?','সেটিংস (⚙️) খুলুন: থিম (লাইট বা ডার্ক), ভাষা (বাংলা বা English) এবং কারেন্সি। কারেন্সি শুধু চিহ্ন বদলায়; আগের অঙ্ক রূপান্তর হয় না।'],
['How do I change my name or photo?','After logging in, tap your profile picture and choose Edit profile.','নাম বা ছবি বদলাব কীভাবে?','লগইন করার পর প্রোফাইল ছবিতে চেপে “প্রোফাইল এডিট” বেছে নিন।']]],
['Security and privacy','নিরাপত্তা ও গোপনীয়তা',[
['How does the passcode lock work?','In Settings choose “Set a passcode” (4 to 6 digits). You can add two security questions to reset it later. The lock hides the app on this device and asks again after you have been away for about 30 seconds. It does not encrypt your data.','পাসকোড লক কীভাবে কাজ করে?','সেটিংসে “পাসকোড দিন” বেছে ৪ থেকে ৬ সংখ্যার পাসকোড দিন। পরে রিসেটের জন্য দুটি নিরাপত্তা প্রশ্ন দিতে পারেন। লক এই ডিভাইসে অ্যাপ আড়াল রাখে এবং প্রায় ৩০ সেকেন্ড দূরে থাকার পর আবার চায়। এটি ডেটা এনক্রিপ্ট করে না।'],
['I forgot my passcode.','Tap “Forgot passcode?” on the lock screen. Answer your security questions. If you can’t, a logged-in user can confirm their Google email. Otherwise the data on this device must be erased (without login, that deletes the data).','পাসকোড ভুলে গেছি।','লক স্ক্রিনে “পাসকোড ভুলে গেছেন?” চাপুন। নিরাপত্তা প্রশ্নের উত্তর দিন। না পারলে লগইন করা ব্যবহারকারী Google ইমেইল দিয়ে নিশ্চিত করতে পারেন। নয়তো এই ডিভাইসের ডেটা মুছতে হবে (লগইন ছাড়া হলে ডেটা মুছে যায়)।'],
['How do I clear my data or delete my account?','Settings → Clear data: “This device” erases the copy saved here, and “Cloud data” (when logged in) erases all records, wallets, categories and budgets in your account but keeps your login. To remove everything including your login, tap your profile picture → Delete account (it asks you to sign in with Google once more). Both are permanent.','ডেটা বা অ্যাকাউন্ট মুছব কীভাবে?','সেটিংস → ডেটা মুছুন: “এই ডিভাইস” এখানে সেভ থাকা কপি মোছে, আর “ক্লাউড ডেটা” (লগইন থাকলে) অ্যাকাউন্টের সব রেকর্ড, ওয়ালেট, ক্যাটাগরি ও বাজেট মোছে, লগইন থাকে। লগইনসহ সব মুছতে প্রোফাইল ছবিতে চেপে “অ্যাকাউন্ট মুছুন” বেছে নিন (আরেকবার Google দিয়ে সাইন ইন করতে বলবে)। দুটোই স্থায়ী।'],
['Who can see my data?','Without login, only you, on this device. With login, your data is stored in your account in Google Firebase and only your signed-in account can read it. See the Privacy Policy in Settings for details.','আমার ডেটা কে দেখতে পায়?','লগইন ছাড়া শুধু আপনি, এই ডিভাইসে। লগইন করলে ডেটা Google Firebase এ আপনার অ্যাকাউন্টের অধীনে থাকে এবং শুধু আপনার লগইন করা অ্যাকাউন্টই তা পড়তে পারে। বিস্তারিত সেটিংসের গোপনীয়তা নীতিতে আছে।']]],
['Problems and feedback','সমস্যা ও মতামত',[
['I found a bug or have an idea.','Tap Feedback in Settings to open the feedback form, or email the address below. The app’s code was written with Claude AI, so mistakes can happen and your feedback really helps.','বাগ পেয়েছি বা আইডিয়া আছে।','সেটিংসের “মতামত” চেপে ফর্মটি খুলুন, অথবা নিচের ঠিকানায় ইমেইল করুন। অ্যাপের কোড Claude AI দিয়ে লেখা, তাই ভুল থাকতে পারে এবং আপনার মতামত অনেক কাজে লাগে।']]]];

function helpSheet(){const o=$('#m'),bn=S.lang==='bn',L=(e,b)=>bn?b:e;o.hidden=false;
o.innerHTML=`<div class="sheet leg faq full"><div class="sh"><h2>❓ ${L('Help','সাহায্য')}</h2><button class="xb" data-a="cl" aria-label="Close">✕</button></div><p style="color:var(--mut)">${L('Answers about every part of the app. Tap a question to open it.','অ্যাপের সব অংশ নিয়ে প্রশ্ন ও উত্তর। প্রশ্নে চাপলে উত্তর খুলবে।')}</p><input id="hq" type="search" class="fqs" autocomplete="off" placeholder="🔍 ${L('Search help','সাহায্যে খুঁজুন')}">`+FAQ.map(s=>`<div class="fsec"><h4>${esc(s[bn?1:0])}</h4>`+s[2].map(x=>`<details><summary>${esc(x[bn?2:0])}</summary><p>${esc(x[bn?3:1])}</p></details>`).join('')+`</div>`).join('')+`<p id="hno" hidden style="text-align:center;color:var(--mut);margin-top:16px">${L('Nothing found. Try another word or send feedback.','কিছু পাওয়া যায়নি। অন্য শব্দে খুঁজুন বা মতামত পাঠান।')}</p><h4>${L('Still need help?','আরও সাহায্য লাগবে?')}</h4><p>${L('Use Feedback in Settings, or email','সেটিংসের মতামত ফর্ম ব্যবহার করুন, অথবা ইমেইল করুন')} <a href="mailto:${CONTACT}">${CONTACT}</a></p></div>`;
const q=$('#hq');q.oninput=()=>{const w=q.value.trim().toLowerCase();let any=false;o.querySelectorAll('.fsec').forEach(s=>{let n=0;s.querySelectorAll('details').forEach(d=>{const m=!w||d.textContent.toLowerCase().includes(w);d.hidden=!m;if(m){n++;any=true}d.open=!!w&&m});s.hidden=!n});$('#hno').hidden=any}}
let back=null,cs=null;

/* ---- live insight data from the app ---- */
function tr(a,b){const o=[],days=Math.round((b-a)/864e5);
if(days<=35){for(let i=0;i<days;i++){const s0=addD(a,i),e0=addD(a,i+1),x=sm(inR([s0,e0]));if(x.i||x.e)o.push({period:d2(s0),income:x.i,expense:x.e})}}
else{for(let m=mi(a);mS(m)<b;m++){const x=sm(inR([mS(m),mS(m+1)]));o.push({period:df(mS(m),{month:'short',year:'numeric'}),income:x.i,expense:x.e})}}
return o}
function ctx(){try{
const [a,b]=pr(rng),rs=inR([a,b]).sort((x,y)=>y.ts-x.ts),s=sm(rs),sh=ty=>catTot(rs,ty).map(([id,v])=>({category:nm(cat(id)),amount:v,percentOfTotal:s[ty]?Math.round(v/s[ty]*1000)/10:0}));
const sp={};inR(mr(mi(Date.now()))).filter(r=>r.t==='e').forEach(r=>sp[r.cat]=r2((sp[r.cat]||0)+r.amt));
const day=ts=>d2(ts);
return JSON.stringify({today:day(Date.now()),currency:cur(),symbol:csym().trim(),selectedPeriod:{label:rlab(),from:day(a),to:day(b-1),days:Math.round((b-a)/864e5),mode:rng},
totals:{income:s.i,expense:s.e,net:r2(s.i-s.e),savingsRatePercent:s.i?Math.round((s.i-s.e)/s.i*1000)/10:null,recordCount:rs.length},
expenseByCategory:sh('e'),incomeByCategory:sh('i'),
trend:tr(a,b),previousPeriod:(()=>{const [pa,pb]=pr(rng,a-1),pr_=inR([pa,pb]),ps=sm(pr_);return{from:day(pa),to:day(pb-1),income:ps.i,expense:ps.e,net:r2(ps.i-ps.e),expenseByCategory:catTot(pr_,'e').map(([id,v])=>({category:nm(cat(id)),amount:v})),incomeByCategory:catTot(pr_,'i').map(([id,v])=>({category:nm(cat(id)),amount:v}))}})(),last6Months:(()=>{const o=[],n=mi(Date.now());for(let m=n-5;m<=n;m++){const x=sm(inR([mS(m),mS(m+1)]));o.push({month:df(mS(m),{month:'short',year:'numeric'}),income:x.i,expense:x.e})}return o})(),
monthlyBudgetsThisMonth:S.cats.filter(c=>c.type==='e'&&+S.b[c.id]>0).map(c=>({category:nm(c),budget:+S.b[c.id],spent:sp[c.id]||0,remaining:r2(+S.b[c.id]-(sp[c.id]||0))})),
wallets:S.accounts.map(x=>({wallet:nm(x),balance:r2(bal(x))})),
transactionsIncluded:Math.min(rs.length,500),transactionsTotalInPeriod:rs.length,transactions:rs.slice(0,500).map(r=>({date:day(r.ts),type:r.t==='e'?'expense':r.t==='i'?'income':'transfer',category:r.t==='t'?undefined:nm(cat(r.cat)),wallet:nm(acc(r.acc))+(r.t==='t'?' > '+nm(acc(r.to)):''),amount:r.amt,note:r.note||undefined}))})}catch(e){return'{}'}}

<small style="color:var(--mut);display:block;margin-top:8px;line-height:1.55">💡 ${L('Tip: in Google Cloud Console → APIs & Services → Credentials, restrict this key to your site address (HTTP referrers) and to the Generative Language API, so it is useless elsewhere if it ever leaks.','টিপ: Google Cloud Console → APIs & Services → Credentials এ গিয়ে এই key-টা শুধু আপনার সাইটের ঠিকানা (HTTP referrers) ও Generative Language API তে সীমাবদ্ধ করুন, যাতে কখনো ফাঁস হলেও অন্য কোথাও কাজ না করে।')}</small>
<div class="row"><button class="g" id="aikc">${L('Cancel','বাতিল')}</button>${ok?`<button class="dng" id="aikr">${L('Remove key','কি মুছুন')}</button>`:''}<button class="p" id="aiks">${L('Save','সেভ')}</button></div></div>`;
const i=Q('#aiki');i.value=gk();try{Q('#aikm').checked=!!localStorage.getItem(KN)}catch(e){}
const save=()=>{const v=i.value.trim();if(!/^\S{20,}$/.test(v))return toast(L('Enter a valid API key','সঠিক API Key দিন'));const rm=Q('#aikm').checked;try{sessionStorage.removeItem(KN);localStorage.removeItem(KN);(rm?localStorage:sessionStorage).setItem(KN,v)}catch(e){return toast('✗')}paint();toast(L('API key saved','API Key সেভ হয়েছে'));drawChat()};
Q('#aikx').onclick=close;Q('#aiks').onclick=save;i.onkeydown=e=>{if(e.key==='Enter')save()};
Q('#aikc').onclick=()=>has()&&view.length?drawChat():close();
const r=Q('#aikr');if(r)r.onclick=()=>{window.aiWipe();hist=[];view=[];paint();close();toast(L('API key removed','API Key মুছে গেছে'))};
setTimeout(()=>{try{i.focus()}catch(e){}},60)}

const bub=m=>`<div class="ai-1 ${m.r}${m.err?' er':''}"><div class="ai-b">${m.r==='u'?esc(m.t):md(m.t)}</div></div>`;
const empty=()=>`<div class="ai-em"><div class="ai-ico">${SP}</div><b style="color:var(--ink);font-size:16px">${L('Ask about your money','আপনার টাকার হিসাব নিয়ে জিজ্ঞাসা করুন')}</b><br>${L('Pick a ready-made prompt below or type your own question. The AI sees the insights for the selected period.','নিচের তৈরি প্রম্পট বেছে নিন বা নিজের প্রশ্ন লিখুন। AI নির্বাচিত সময়ের ইনসাইট দেখতে পায়।')}</div>`;
const down=()=>requestAnimationFrame(()=>{const m=Q('#aim');if(m)m.scrollTop=m.scrollHeight});

function drawChat(){const c=Q('#aic');show('chat');
c.innerHTML=`<div class="ai-h"><span class="ai-ico">${SP}</span><div class="mid"><b>${L('AI Insights','AI ইনসাইট')}</b><small id="airl">${esc(rlab())}</small></div><button id="aikb" aria-label="API key">🔑</button><button id="aicl" aria-label="Clear">🗑️</button><button id="aix" aria-label="Close">✕</button></div>
<div class="ai-rg">${RG.map(r=>`<button type="button" data-r="${r[0]}" class="${r[0]===rng?'on':''}">${L(r[1],r[2])}</button>`).join('')}</div>
<div class="ai-wn" id="aiwn" ${['3','6','y'].includes(rng)?'':'hidden'}>⚠️ ${L('Long period selected. Monthly is recommended for best results; this may hit the free limit or fail.','লম্বা সময় বাছাই করা হয়েছে। সেরা ফলের জন্য মাসিক (Monthly) ভালো; ফ্রি সীমা শেষ হতে বা এরর আসতে পারে।')}</div>

Q('#aix').onclick=close;Q('#aikb').onclick=drawKey;
Q('#aicl').onclick=()=>{if(busy)return;hist=[];view=[];drawChat()};
c.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{rng=b.dataset.r;c.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b));Q('#airl').textContent=rlab();Q('#aiwn').hidden=!['3','6','y'].includes(rng)});
c.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>send(PRM()[b.dataset.p][1]));

ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&matchMedia('(hover:hover) and (pointer:fine)').matches){e.preventDefault();Q('#aif').requestSubmit()}};

function add(r,t,err){const m={r,t,err};view.push(m);const box=Q('#aim');if(box){const em=box.querySelector('.ai-em');if(em)em.remove();box.insertAdjacentHTML('beforeend',bub(m));down()}}
function typing(on){const box=Q('#aim');if(!box)return;const o=Q('#aity');if(!on){if(o)o.remove();return}if(!o){box.insertAdjacentHTML('beforeend','<div class="ai-1 a ai-ty" id="aity"><div class="ai-b"><i></i><i></i><i></i></div></div>');down()}}

async function send(text){text=(text||'').trim();if(!text||busy)return;
if(!has())return drawKey();
add('u',text);
if(!navigator.onLine)return add('a','⚠️ '+L('You are offline. Connect to the internet and try again.','আপনি অফলাইনে আছেন। ইন্টারনেট সংযোগ দিয়ে আবার চেষ্টা করুন।'),true);
busy=true;const sd=Q('#aisd');if(sd)sd.disabled=true;typing(true);
const sys=`You are a friendly, sharp personal-finance analyst inside a budgeting app. Base every answer ONLY on the user's data below and never invent numbers. Amounts are in ${cur()} (symbol ${csym().trim()}). If the data is empty or too thin, say so and suggest what to record. The USER DATA covers the whole selected period (every record is counted in the totals, categories and trend; the transactions list holds up to 500 of the newest records). Be concise and practical: short headings, bullet points, and a small Markdown table when comparing things; end with 1-3 concrete next actions. Reply in ${S.lang==='bn'?'Bengali (unless the user writes in another language)':'the language the user writes in'}.\n\nUSER DATA (JSON, live from the app):\n${ctx()}`;
const payload={contents:[...hist.slice(-16),{role:'user',parts:[{text}]}],systemInstruction:{parts:[{text:sys}]}};
const url=`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(gk())}`;
try{const res=await fetchR(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),data=await res.json();
if(data.error)throw new Error(data.error.message||'API error');
const reply=(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts||[]).map(p=>p.text||'').join('')||L('No response received. Please try again.','কোনো উত্তর পাওয়া যায়নি। আবার চেষ্টা করুন।');
hist.push({role:'user',parts:[{text}]},{role:'model',parts:[{text:reply}]});typing(false);add('a',reply)}
catch(err){typing(false);let m=String(err&&err.message||'Network error');if(/api key/i.test(m))m+='\n\n'+L('Tap 🔑 above to update your key.','কি বদলাতে উপরের 🔑 চাপুন।');add('a','⚠️ '+m,true)}
finally{busy=false;const s2=Q('#aisd');if(s2)s2.disabled=false}}
async function fetchR(url,opt,n=2,d=1000){try{const r=await fetch(url,opt);if((r.status===429||r.status===503)&&n>0){await new Promise(s=>setTimeout(s,d));return fetchR(url,opt,n-1,d*2)}return r}catch(e){if(n>0&&navigator.onLine){await new Promise(s=>setTimeout(s,d));return fetchR(url,opt,n-1,d*2)}throw e}}

/* ---- wiring ---- */
Q('#aib').addEventListener('click',()=>{if(!navigator.onLine)return;open(has()?'chat':'key')});
Q('#ai').addEventListener('click',e=>{if(e.target===Q('#ai'))close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!Q('#ai').hidden)close()});
addEventListener('online',paint);addEventListener('offline',paint);
window.aiPaint=paint;window.aiReset=()=>{hist=[];view=[];if(!Q('#ai').hidden)close()};window.aiWipe=()=>{try{sessionStorage.removeItem(KN)}catch(e){}try{localStorage.removeItem(KN)}catch(e){}};paint();
})();

<script>(function(){
/* status-bar colour: grey only while a dimmed sheet is open */
var cur=null,goal=null;
function mt(){return document.querySelector('meta[name=theme-color]')}
function target(){var dark=document.documentElement.dataset.theme==='dark',m=document.querySelector('#m:not([hidden])'),open=!!m&&!m.querySelector('.rf,.full');
return open?(dark?'#0c0d12':'#abacaf'):(dark?'#11131a':'#f4f5fa')}
function sync(){try{var t=target();if(t===goal)return;goal=t;var m=mt();if(m&&m.content!==t)m.content=t}catch(e){}}
window.tcSync=sync;
new MutationObserver(sync).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['data-theme','hidden']});
addEventListener('load',sync);sync();
})()</script>
<script>(function(){
/* Android back button: close the top-most layer; on the home screen ask to press back twice to exit */
var left=false,th=[],lastExit=0,Q=function(x){return document.querySelector(x)};
function vis(x){var e=Q(x);return !!e&&!e.hidden}
function top(){
if(vis('#pl'))return'lock';
if(vis('#ai'))return'ai';
if(vis('#m'))return'm';
if(vis('#ddm'))return'dd';
if(vis('#lo'))return'';
try{if(ad)return'ad';if(tab!=='rec')return'tab'}catch(e){}
return''}
function closeTop(){var t=top();
if(t==='lock')return true;
if(t==='ai'){document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'}));return true}
if(t==='m'){try{A.cl()}catch(e){var m=Q('#m');m.hidden=true;m.innerHTML=''}return true}
if(t==='dd'){Q('#ddm').hidden=true;return true}
if(t==='ad'){ad=null;R();return true}
if(t==='tab'){var p=th.pop()||'rec';if(p===tab)p='rec';go(p);return true}
return false}
/* remember previous tab exactly when it changes (no polling) */
var go=function(x){A.tab(x)};
try{var ot=A.tab;A.tab=function(x){var prev=tab;ot.apply(this,arguments);if(prev!==tab&&!go.back){th.push(prev);if(th.length>30)th.shift()}};}catch(e){}
go=function(x){go.back=1;try{A.tab(x)}finally{go.back=0}};
function toastMsg(){try{var bn=S.lang==='bn';toast(bn?'বের হতে আবার ব্যাক চাপুন':'Press back again to exit')}catch(e){}}
try{history.replaceState({root:1},'');history.pushState({app:1},'')}catch(e){}
addEventListener('popstate',function(e){
if(left)return;
if(closeTop()){try{history.pushState({app:1},'')}catch(x){}return}
var n=Date.now();
if(n-lastExit<2000){left=true;history.back();
/* if the browser did not actually leave, re-arm the handler */
setTimeout(function(){left=false;try{history.pushState({app:1},'')}catch(x){}},600)}
else{lastExit=n;toastMsg();try{history.pushState({app:1},'')}catch(x){}}});
})()</script>
