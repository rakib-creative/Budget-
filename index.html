const LEG={pp:{en:`<p><small>Last updated: 22 October 2026</small></p><h4>1. What this app is</h4><p>Budget is a personal income and expense tracker.</p><h4>2. What data we handle</h4><p>(a) What you enter: amounts, categories, notes, wallets, budgets, dates and settings (language, theme, currency). (b) If you sign in with Google: your name, email address, profile photo and a unique account ID from Google. We never see your Google password.</p><h4>3. Where it is stored</h4><p>Without login, only in your device’s browser storage. We cannot see it, and clearing browser data deletes it. With login, it is also stored in Google Firebase (Cloud Firestore) under your account so it syncs across devices. Security rules allow only your signed-in account to read or write your data. A custom name or profile photo you set in the app is saved the same way. A passcode and the answers to your security questions, if you set them, are stored only on your device (as one-way hashes) and are never uploaded. Wallet details, search and the period filter (daily to yearly) run on your device using the data you already have.</p><h4>4. How we use it</h4><p>Only to run the app: show your records, search them on your device, sync, and create reports, PDF and CSV. No ads, no selling or sharing of your data, and no tracking or analytics run by us.</p><h4>5. Third parties</h4><p>Google (sign-in and database via Firebase), Google Fonts (fonts), Cloudflare cdnjs (PDF libraries) and the hosting service may log standard visit information such as IP address. Their own policies apply.</p><h4>6. Reports and files</h4><p>PDF, CSV and print files are created on your device and are not uploaded anywhere.</p><h4>7. Your choices and deleting your account</h4><p>You can use the app without logging in, sign out at any time and delete records inside the app. In Settings, Clear data lets you erase the copy saved on this device or, when logged in, erase all your records, wallets, categories and budgets in the cloud while keeping your account. If you forget your passcode, you can reset it with your security questions; without them, a logged-in user can confirm the account email, and otherwise the data on this device must be cleared (without login, this erases the data). You can delete your account yourself: tap your profile picture, then Delete account. After a warning and one more Google sign-in to confirm, this permanently deletes:</p><ul><li>your cloud data (records, wallets, categories, budgets, settings),</li><li>the copy of that data on the device, and</li><li>your sign-in with this app.</li></ul><p>Your Google account itself is not deleted. Deletion cannot be undone, and Google’s systems may take a short time to fully remove deleted data. You can also email ${CONTACT} for help.</p><h4>8. Security</h4><p>Data travels over HTTPS and is protected by account-based rules, but no system is 100% secure. Keep your Google account safe and sign out on shared devices.</p><h4>9. Children</h4><p>This app is not meant for children under 13.</p><h4>10. Changes</h4><p>If this policy changes, the new version and date will appear here.</p><h4>11. Contact</h4><p>${CONTACT}</p>`,
bn:`<p><small>শেষ হালনাগাদ: ২২ অক্টোবর ২০২৬</small></p><h4>১. এই অ্যাপ কী</h4><p>Budget হলো ব্যক্তিগত আয়-ব্যয়ের হিসাব রাখার অ্যাপ।</p><h4>২. আমরা কোন তথ্য নিই</h4><p>(ক) আপনার দেওয়া হিসাব: টাকার অঙ্ক, ক্যাটাগরি, নোট, ওয়ালেট, বাজেট, তারিখ এবং সেটিংস (ভাষা, থিম, কারেন্সি)। (খ) Google দিয়ে লগইন করলে: আপনার নাম, ইমেইল, প্রোফাইল ছবি ও Google এর দেওয়া একটি ইউনিক আইডি। আপনার Google পাসওয়ার্ড আমরা কখনো দেখি না।</p><h4>৩. তথ্য কোথায় থাকে</h4><p>লগইন ছাড়া শুধু আপনার ডিভাইসের ব্রাউজারে থাকে। আমরা তা দেখতে পাই না, আর ব্রাউজারের ডেটা মুছলে তা চলে যাবে। লগইন করলে Google Firebase (Cloud Firestore) এ আপনার অ্যাকাউন্টের অধীনে সেভ হয়, যাতে সব ডিভাইসে সিঙ্ক থাকে। নিরাপত্তা নিয়মে শুধু আপনার লগইন করা অ্যাকাউন্টই আপনার তথ্য পড়তে ও লিখতে পারে। অ্যাপে আপনার দেওয়া নাম বা প্রোফাইল ছবিও একইভাবে সেভ হয়। পাসকোড এবং নিরাপত্তা প্রশ্নের উত্তর দিলে তা শুধু আপনার ডিভাইসে (একমুখী হ্যাশ হিসেবে) থাকে, কখনো আপলোড হয় না। ওয়ালেটের বিবরণ, খোঁজা এবং সময়কাল ফিল্টার (দৈনিক থেকে বাৎসরিক) আপনার ডিভাইসেই, আপনার আগের ডেটা দিয়ে চলে।</p><h4>৪. কীভাবে ব্যবহার হয়</h4><p>শুধু অ্যাপ চালাতে: রেকর্ড দেখানো, আপনার ডিভাইসে খোঁজা, সিঙ্ক করা, রিপোর্ট/PDF/CSV বানানো। আমরা বিজ্ঞাপন দেখাই না, আপনার তথ্য বিক্রি বা শেয়ার করি না, আর নিজেরা কোনো ট্র্যাকিং বা অ্যানালিটিক্স চালাই না।</p><h4>৫. তৃতীয় পক্ষ</h4><p>Google (Firebase এর মাধ্যমে লগইন ও ডেটাবেস), Google Fonts (ফন্ট), Cloudflare cdnjs (PDF লাইব্রেরি) এবং হোস্টিং সেবা সাধারণ ভিজিটের তথ্য (যেমন IP অ্যাড্রেস) লগ করতে পারে। তাদের নিজ নিজ নীতি প্রযোজ্য।</p><h4>৬. রিপোর্ট ও ফাইল</h4><p>PDF, CSV ও প্রিন্ট আপনার ডিভাইসেই তৈরি হয়, কোথাও আপলোড হয় না।</p><h4>৭. আপনার নিয়ন্ত্রণ ও অ্যাকাউন্ট মোছা</h4><p>লগইন ছাড়াই অ্যাপ ব্যবহার করা যায়। যেকোনো সময় সাইন আউট করা যায় এবং অ্যাপ থেকে রেকর্ড মুছে ফেলা যায়। সেটিংসের “ডেটা মুছুন” থেকে এই ডিভাইসে সেভ থাকা কপি, অথবা লগইন করা থাকলে ক্লাউডের সব রেকর্ড, ওয়ালেট, ক্যাটাগরি ও বাজেট (অ্যাকাউন্ট রেখে) মুছে ফেলা যায়। পাসকোড ভুলে গেলে নিরাপত্তা প্রশ্ন দিয়ে রিসেট করা যায়; প্রশ্ন না থাকলে লগইন করা ব্যবহারকারী অ্যাকাউন্টের ইমেইল লিখে নিশ্চিত করতে পারেন, নয়তো এই ডিভাইসের ডেটা মুছতে হবে (লগইন ছাড়া হলে ডেটা মুছে যায়)। আপনি নিজেই অ্যাকাউন্ট মুছতে পারেন: প্রোফাইল ছবিতে চাপ দিয়ে “অ্যাকাউন্ট মুছুন” বেছে নিন। সতর্কবার্তা দেখে এবং নিশ্চিত করতে আবার Google দিয়ে সাইন ইন করলে নিচের জিনিসগুলো স্থায়ীভাবে মুছে যায়:</p><ul><li>ক্লাউডে থাকা আপনার তথ্য (রেকর্ড, ওয়ালেট, ক্যাটাগরি, বাজেট, সেটিংস),</li><li>ওই ডিভাইসে থাকা তথ্যের কপি, এবং</li><li>এই অ্যাপে আপনার লগইন।</li></ul><p>আপনার Google অ্যাকাউন্ট নিজে মুছে যায় না। মোছা কাজ আর ফেরানো যায় না, আর Google এর সিস্টেম থেকে মুছে যাওয়া তথ্য পুরোপুরি সরতে কিছু সময় লাগতে পারে। সাহায্যের জন্য ${CONTACT} এ ইমেইলও করতে পারেন।</p><h4>৮. নিরাপত্তা</h4><p>তথ্য HTTPS দিয়ে যায় এবং অ্যাকাউন্টভিত্তিক নিয়মে সুরক্ষিত। তবে কোনো সিস্টেমই ১০০% নিরাপদ নয়। আপনার Google অ্যাকাউন্ট নিরাপদ রাখুন, আর শেয়ার করা ডিভাইসে ব্যবহার শেষে সাইন আউট করুন।</p><h4>৯. শিশু</h4><p>এই অ্যাপ ১৩ বছরের কম বয়সীদের জন্য নয়।</p><h4>১০. পরিবর্তন</h4><p>নীতি বদলালে নতুন সংস্করণ ও তারিখ এখানে দেখানো হবে।</p><h4>১১. যোগাযোগ</h4><p>${CONTACT}</p>`},
tc:{en:`<p><small>Last updated: 22 October 2026</small></p><h4>1. Acceptance</h4><p>By using Budget you agree to these terms. If you do not agree, please do not use the app.</p><h4>2. The service</h4><p>Budget is a free personal money tracker, provided “as is”.</p><h4>3. Not professional advice</h4><p>Budget is not financial, tax, accounting or legal advice. Totals and reports depend on what you enter, so please check them yourself.</p><h4>4. Your data and account</h4><p>Your data belongs to you. You are responsible for entering it correctly, keeping your device and Google account secure, and keeping your own backup (for example a PDF or CSV export). You can clear your data from Settings or delete your account from the profile menu at any time. Clearing and deletion are permanent and cannot be undone.</p><h4>5. Acceptable use</h4><p>Do not misuse the app: no unauthorised access, no disrupting the service, no bypassing its security, and no unlawful use.</p><h4>6. Currency</h4><p>The currency setting only changes the symbol. Existing amounts are not converted.</p><h4>7. Availability</h4><p>We may change, pause or stop the app at any time. Data can be lost, for example when browser data is cleared, sync fails, an account is deleted or a forgotten passcode forces data to be erased. The passcode is a privacy lock, not strong security.</p><h4>8. Limitation of liability</h4><p>To the maximum extent allowed by law, the app owner is not liable for indirect or incidental loss, or for loss of data, arising from your use of the app.</p><h4>9. Ending use</h4><p>You can stop using the app at any time or delete your account. We may restrict access if the app is misused.</p><h4>10. Changes</h4><p>We may update these terms. Continued use means you accept the new version.</p><h4>11. Contact</h4><p>${CONTACT}</p>`,
bn:`<p><small>শেষ হালনাগাদ: ২২ অক্টোবর ২০২৬</small></p><h4>১. সম্মতি</h4><p>Budget ব্যবহার করলে আপনি এই শর্তগুলোতে সম্মত হচ্ছেন। সম্মত না হলে অ্যাপটি ব্যবহার করবেন না।</p><h4>২. সেবা</h4><p>Budget একটি বিনামূল্যের ব্যক্তিগত আয়-ব্যয়ের অ্যাপ, যেমন আছে তেমনভাবে (“as is”) দেওয়া হয়।</p><h4>৩. পেশাদার পরামর্শ নয়</h4><p>Budget আর্থিক, কর, হিসাবরক্ষণ বা আইনি পরামর্শ নয়। মোট অঙ্ক ও রিপোর্ট আপনার দেওয়া তথ্যের ওপর নির্ভর করে, তাই নিজে যাচাই করে নিন।</p><h4>৪. আপনার তথ্য ও অ্যাকাউন্ট</h4><p>আপনার তথ্য আপনারই। সঠিকভাবে তথ্য দেওয়া, ডিভাইস ও Google অ্যাকাউন্ট নিরাপদ রাখা এবং নিজের ব্যাকআপ (যেমন PDF বা CSV) রাখার দায়িত্ব আপনার। সেটিংস থেকে ডেটা মুছতে বা প্রোফাইল মেনু থেকে যেকোনো সময় অ্যাকাউন্ট মুছতে পারেন। ডেটা মোছা ও অ্যাকাউন্ট মোছা স্থায়ী, আর ফেরানো যায় না।</p><h4>৫. গ্রহণযোগ্য ব্যবহার</h4><p>অ্যাপের অপব্যবহার করবেন না: অনুমতি ছাড়া প্রবেশ, সেবা বিঘ্নিত করা, নিরাপত্তা এড়িয়ে যাওয়া বা বেআইনি কাজে ব্যবহার করা যাবে না।</p><h4>৬. কারেন্সি</h4><p>কারেন্সি সেটিং শুধু চিহ্ন বদলায়। আগের অঙ্ক রূপান্তর হয় না।</p><h4>৭. সেবার প্রাপ্যতা</h4><p>আমরা যেকোনো সময় অ্যাপ বদলাতে, সাময়িক বা স্থায়ীভাবে বন্ধ করতে পারি। ব্রাউজারের ডেটা মুছলে, সিঙ্ক ব্যর্থ হলে, অ্যাকাউন্ট মুছলে বা পাসকোড ভুলে ডেটা মুছতে হলে তথ্য হারিয়ে যেতে পারে। পাসকোড একটি গোপনীয়তার লক, শক্তিশালী নিরাপত্তা নয়।</p><h4>৮. দায়ের সীমা</h4><p>আইনে যতটুকু অনুমোদিত, অ্যাপ ব্যবহারের ফলে হওয়া পরোক্ষ ক্ষতি বা তথ্য হারানোর দায় অ্যাপের মালিকের নয়।</p><h4>৯. ব্যবহার বন্ধ</h4><p>আপনি যেকোনো সময় ব্যবহার বন্ধ করতে বা অ্যাকাউন্ট মুছতে পারেন। অপব্যবহার হলে আমরা প্রবেশ সীমিত করতে পারি।</p><h4>১০. পরিবর্তন</h4><p>আমরা শর্ত হালনাগাদ করতে পারি। ব্যবহার চালিয়ে গেলে নতুন সংস্করণে সম্মতি ধরা হবে।</p><h4>১১. যোগাযোগ</h4><p>${CONTACT}</p>`}};
